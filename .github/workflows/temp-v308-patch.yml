name: Temporary v3.0.8 patch

on:
  push:
    branches:
      - fix/v3.0.8-globoplay-metadata-whatsapp

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.8-globoplay-metadata-whatsapp
      - name: Apply guarded patch
        run: python3 tools/patch_v308.py
      - name: Verify changes
        run: |
          grep -q 'versionCode = 308' app/build.gradle.kts
          grep -q 'MAX_GLOBOPLAY_DEEP_FALLBACK_NATIONAL = 72' app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          grep -q 'WhatsApp' app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt
          git diff --check
      - name: Commit patched application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt app/build.gradle.kts
          git commit -m 'feat: v3.0.8 metadata coverage and WhatsApp sharing'
          git push origin HEAD:fix/v3.0.8-globoplay-metadata-whatsapp
