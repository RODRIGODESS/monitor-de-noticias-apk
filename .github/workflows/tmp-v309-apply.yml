name: TEMP Apply v3.0.9

on:
  push:
    branches:
      - fix/v3.0.9-national-globoplay-diagnostics-layout

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[patched-v309]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.9-national-globoplay-diagnostics-layout
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/apply_v309.py
      - name: Commit application changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/VideoModels.kt
          git add app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          git add app/src/main/java/br/com/monitordenoticias/android/VideoViewModel.kt
          git add app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt
          git add app/src/main/java/br/com/monitordenoticias/android/MainActivityV28.kt
          git add app/build.gradle.kts
          git diff --cached --check
          git commit -m "fix: v3.0.9 national Globoplay diagnostics and layout [patched-v309]"
          git push origin HEAD:fix/v3.0.9-national-globoplay-diagnostics-layout
