name: Windows v4.0.3 Kotlin preflight

on:
  push:
    branches:
      - "codex/windows/v4.0.3-portable"
    paths:
      - "desktop/**"
      - "app/src/main/java/br/com/monitordenoticias/android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/windows-v403-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-v403-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare native icon expected by Gradle configuration
        shell: bash
        run: |
          base64 -d desktop/src/main/resources/monitor_icon.ico.b64 > desktop/src/main/resources/monitor_icon.ico
          test -s desktop/src/main/resources/monitor_icon.ico

      - name: Compile Windows desktop Kotlin
        run: gradle :desktop:compileKotlin --stacktrace
