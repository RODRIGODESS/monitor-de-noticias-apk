name: TEMP Probe JH JN raw HTML

on:
  push:
    branches:
      - fix/v3.0.9-national-globoplay-diagnostics-layout

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify JH/JN Jarvis search coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error, concurrent.futures
          endpoint='https://cloud-jarvis.globo.com/graphql'
          headers={'content-type':'application/json','x-platform-id':'web','x-device-id':'desktop','x-client-version':'2024.12-5','user-agent':'Mozilla/5.0'}
          base='''query Probe($q:String!) { search { videos(query:$q) { page nextPage total hasNextPage resources { id headline description duration title { headline originProgramId } } } } }'''
          queries=['Jornal Hoje','Jornal Nacional','Veja os desfiles de 7 de setembro pelo país','Comemorações do 7 de setembro']
          def run(q):
            req=urllib.request.Request(endpoint,data=json.dumps({'operationName':'Probe','variables':{'q':q},'query':base}).encode(),headers=headers,method='POST')
            try:
              with urllib.request.urlopen(req,timeout=25) as r: raw=r.read().decode()
            except urllib.error.HTTPError as e: raw=e.read().decode()
            return q,json.loads(raw)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            for q,d in ex.map(run,queries):
              print('=== QUERY',q,'===')
              if d.get('errors'): print('ERRORS=',d['errors']); continue
              c=d['data']['search']['videos']
              print('PAGE=',c.get('page'),'NEXT=',c.get('nextPage'),'TOTAL=',c.get('total'),'HAS_NEXT=',c.get('hasNextPage'),'COUNT=',len(c.get('resources') or []))
              for v in c.get('resources') or []:
                print('VIDEO=',json.dumps(v,ensure_ascii=False))
          # Probe pagination argument shape separately.
          for syntax in ['page:2','pageNumber:2','offset:24']:
            q='query { search { videos(query:"Jornal Hoje", '+syntax+') { page nextPage resources { id headline } } } }'
            req=urllib.request.Request(endpoint,data=json.dumps({'query':q}).encode(),headers=headers,method='POST')
            try:
              with urllib.request.urlopen(req,timeout=25) as r: raw=r.read().decode()
            except urllib.error.HTTPError as e: raw=e.read().decode()
            print('PAGINATION',syntax,raw[:1500])
          PY
