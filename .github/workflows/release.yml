name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Validate code on pull request
        if: github.event_name == 'pull_request'
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: permanent Android signing secrets are missing."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/monitor-noticias-release.jks
          test -s signing/monitor-noticias-release.jks

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/monitor-noticias-release.jks
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleRelease

      - name: Verify permanent signing certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          FINAL="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="signing/monitor-noticias-release.jks"
          EXPECTED_CERT="07164d3faf3ee09f241a547d403767c454b226faac26c4b058bc5011d773b1b0"

          "$APKSIGNER" verify --verbose "$FINAL"
          final_output=$("$APKSIGNER" verify --verbose --print-certs "$FINAL" 2>&1)
          printf '%s\n' "$final_output"

          extract_cert() {
            local output="$1"
            local line
            line=$(printf '%s\n' "$output" | grep -iE 'certificate.*sha-?256.*digest|sha-?256.*certificate.*digest' | head -1 || true)
            if [ -z "$line" ]; then
              line=$(printf '%s\n' "$output" | grep -iE 'sha-?256.*digest' | head -1 || true)
            fi
            printf '%s\n' "$line" | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ':[:space:]\r' | tr 'A-F' 'a-f'
          }

          FINAL_CERT=$(extract_cert "$final_output")
          KEYSTORE_CERT=$(keytool -list -v -keystore "$KEYSTORE" -alias monitor-noticias -storepass "$ANDROID_SIGNING_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":","",$2); gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')

          echo "Release certificate:  $FINAL_CERT"
          echo "Keystore certificate: $KEYSTORE_CERT"
          test -n "$FINAL_CERT"
          test -n "$KEYSTORE_CERT"
          test "$KEYSTORE_CERT" = "$EXPECTED_CERT"
          test "$FINAL_CERT" = "$EXPECTED_CERT"
          echo "PERMANENT_SIGNING_OK=true"

      - name: Prepare v2.7.0 release asset
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk monitor-de-noticias-v2.7.0.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.0
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v2.7.0
          body: |
            Versão 2.7.0 do Monitor de Notícias Android.

            Nova experiência visual:
            - dashboard inicial profissional com saúde do monitor e indicadores;
            - navegação inferior: Início, Fontes, Período, Demandas e Mais;
            - Histórico, Termos e Configurações acessíveis pelo menu Mais;
            - tipografia e cards maiores e mais legíveis;
            - notícias com hierarquia visual, badges e metadados claros;
            - Fontes e Período redesenhados para uso confortável em celular;
            - Demandas com status operacional e busca manual individual/geral.

            Área segura do Android:
            - barra inferior usa navigationBarsPadding;
            - todo o conteúdo fica acima da barra de navegação do telefone;
            - ações fixas de Fontes e Período ficam acima da navegação do app;
            - imePadding evita que o teclado esconda os botões durante digitação.

            Segundo plano:
            - mantém WorkManager + heartbeat de recuperação da v2.6;
            - mantém relatório das buscas automáticas em Configurações.

            Atualização:
            - mesma assinatura permanente da linha v2.5+;
            - instalação direta sobre v2.6 preservando dados e configurações.
          files: monitor-de-noticias-v2.7.0.apk
          make_latest: true
