name: Fix v3.0.7 Kotlin label

on:
  push:
    branches: ["fix/v3.0.7-globoplay-editions-errors"]
    paths: [".github/workflows/fix-v307-kotlin-label.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.7-globoplay-editions-errors
          fetch-depth: 0
      - name: Fix lambda label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt')
          text = p.read_text()
          old = '                specLoop@ specs.forEach { spec ->'
          new = '                specs.forEach specLoop@ { spec ->'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one invalid label, found {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text)
          assert 'specs.forEach specLoop@ { spec ->' in text
          assert 'return@specLoop' in text
          print('V307_KOTLIN_LABEL_OK=true')
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          git diff --cached --check
          git commit -m "fix: corrigir rótulo do circuit breaker"
          git push origin HEAD:fix/v3.0.7-globoplay-editions-errors
