name: Apply Windows automation settings

on:
  push:
    branches:
      - codex/windows/v4.0.2-portable
    paths:
      - .github/workflows/automation-settings-patch.yml
      - .github/scripts/automation_settings_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/windows/v4.0.2-portable

      - name: Apply independent automation settings
        run: python .github/scripts/automation_settings_patch.py

      - name: Commit patched Windows files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DesktopController.kt desktop/src/main/kotlin/br/com/monitordenoticias/desktop/Main.kt
          git diff --cached --quiet && exit 0
          git commit -m "feat(windows): configurar automação por notícias demandas e vídeos"
          git push origin HEAD:codex/windows/v4.0.2-portable
