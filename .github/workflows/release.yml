name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Build installable APK
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Verify update compatibility with v2.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download v2.4.0 --repo "$GITHUB_REPOSITORY" --pattern "monitor-de-noticias-v2.4.0.apk" --dir previous
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          CURRENT="app/build/outputs/apk/debug/app-debug.apk"
          PREVIOUS="previous/monitor-de-noticias-v2.4.0.apk"
          echo "=== v2.4.0 certificate ==="
          "$APKSIGNER" verify --print-certs "$PREVIOUS"
          echo "=== v2.5.0 certificate ==="
          "$APKSIGNER" verify --print-certs "$CURRENT"
          OLD_CERT=$("$APKSIGNER" verify --print-certs "$PREVIOUS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$CURRENT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          echo "OLD_CERT=$OLD_CERT"
          echo "NEW_CERT=$NEW_CERT"
          test -n "$OLD_CERT"
          test -n "$NEW_CERT"
          if [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo "ERROR: APK signing certificates differ. Publishing would require uninstalling the installed app and could lose local data."
            exit 1
          fi
          echo "UPDATE_COMPATIBLE=true"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk monitor-de-noticias-v2.5.0.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v2.5.0
          body: |
            Versão 2.5.0 do Monitor de Notícias Android.

            Demandas:
            - pesquisa independente de cada demanda;
            - monitoramento automático a cada 1 hora via WorkManager;
            - botão para pesquisar todas as demandas manualmente;
            - botão de pesquisa individual em cada demanda;
            - registro persistente da última execução, resultados, matérias novas e erros.

            Dados e atualização:
            - mesma identidade de pacote da v2.4.0;
            - assinatura digital comparada automaticamente com o APK v2.4.0 antes da publicação;
            - migração do banco 2 → 3 sem apagar notícias, termos ou demandas existentes;
            - preferências de fontes, período e intervalo continuam preservadas.
          files: monitor-de-noticias-v2.5.0.apk
          make_latest: true
