name: Fix v3.0.1 duplicate patches

on:
  push:
    branches: ["fix/v3.0.1-video-scan-and-demand-alerts"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.1-video-scan-and-demand-alerts
          fetch-depth: 0
      - name: Remove duplicate UI lines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt')
          text = p.read_text()
          line = '    val matchedDemands = news.demands.count { it.lastFoundCount > 0 }\n'
          while line + line in text:
              text = text.replace(line + line, line)
          schedule = '                        Text("Automática: 08h • 12h • 15h • 19h • 21h • busca manual sempre disponível", color = V30Purple, fontSize = 10.5.sp, fontWeight = FontWeight.SemiBold)\n'
          while schedule + schedule in text:
              text = text.replace(schedule + schedule, schedule)
          p.write_text(text)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt
          git commit -m "fix: remove duplicate v3.0.1 UI lines"
          git push origin HEAD:fix/v3.0.1-video-scan-and-demand-alerts
