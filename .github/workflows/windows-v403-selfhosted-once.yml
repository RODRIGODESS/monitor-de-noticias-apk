name: Windows v4.0.3 self-hosted one-shot cleanup

on:
  push:
    branches:
      - "codex/windows/v4.0.3-portable"
    paths:
      - ".github/workflows/windows-v403-selfhosted-once.yml"

permissions:
  contents: read

concurrency:
  group: windows-v403-selfhosted-once
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Cancel superseded self-hosted one-shot"
