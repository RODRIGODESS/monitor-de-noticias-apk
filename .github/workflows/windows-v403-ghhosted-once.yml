name: Windows v4.0.3 GitHub-hosted one-shot

on:
  push:
    branches:
      - "codex/windows/v4.0.3-portable"
    paths:
      - ".github/workflows/windows-v403-ghhosted-once.yml"

permissions:
  contents: write

concurrency:
  group: windows-v403-ghhosted-once
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Confirm Windows runner
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") { throw "Este workflow exige Windows. RUNNER_OS=$env:RUNNER_OS" }
          Write-Host "Runner Windows confirmado: $env:RUNNER_NAME / $env:RUNNER_ARCH"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build, validate, SelfTest, ZIP, SHA-256 and publish v4.0.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\build-windows-v403.ps1 -Publish -TargetCommit "${{ github.sha }}"
