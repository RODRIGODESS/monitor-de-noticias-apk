name: Temporary v3.0.11 Balanço Geral SP fix

on:
  push:
    branches:
      - codex/v3.0.11-source-expansion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3.0.11-source-expansion
      - run: python3 tools/patch_v3011_bgsp.py
      - run: |
          grep -q 'https://record.r7.com/balanco-geral/' app/src/main/java/br/com/monitordenoticias/android/VideoSourceCatalog.kt
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/br/com/monitordenoticias/android/VideoSourceCatalog.kt
          git commit -m 'fix: use current Balanço Geral SP route'
          git push origin HEAD:codex/v3.0.11-source-expansion
