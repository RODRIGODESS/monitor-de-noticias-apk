name: Apply v3.0.7 edition guard

on:
  push:
    branches: ["fix/v3.0.7-globoplay-editions-errors"]
    paths: [".github/workflows/apply-v307-edition-guard.yml"]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.7-globoplay-editions-errors
          fetch-depth: 0
      - name: Harden edition detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/br/com/monitordenoticias/android/GloboplayEditionCollector.kt")
          text = p.read_text()

          old = '''            val context = nearbyText(anchor)\n            if (looksLikeEdition(context)) return@forEach\n\n            val title = bestAnchorTitle(anchor, context)'''
          new = '''            val context = nearbyText(anchor)\n            val title = bestAnchorTitle(anchor, context)'''
          if text.count(old) != 1:
              raise SystemExit("anchor trecho guard not found exactly once")
          text = text.replace(old, new, 1)

          old = '''            val context = html.substring(start, end)\n            if (looksLikeEdition(context) && DATE_REGEX.containsMatchIn(context)) return@forEach\n\n            val center = match.range.first - start'''
          new = '''            val context = html.substring(start, end)\n            val center = match.range.first - start'''
          if text.count(old) != 1:
              raise SystemExit("embedded trecho guard not found exactly once")
          text = text.replace(old, new, 1)

          old = '''    private fun looksLikeEdition(value: String): Boolean {\n        val n = normalize(value)\n        return n.contains("edicao") || n.contains("integra") || n.contains("programa de hoje")\n    }'''
          new = '''    private fun looksLikeEdition(value: String): Boolean {\n        val n = normalize(value)\n        val hasDate = DATE_REGEX.containsMatchIn(value)\n        if (!hasDate) return false\n        return n.contains("edicao") || n.contains("integra") || n.contains("programa de hoje")\n    }'''
          if text.count(old) != 1:
              raise SystemExit("looksLikeEdition block not found exactly once")
          text = text.replace(old, new, 1)

          p.write_text(text)
          assert 'val hasDate = DATE_REGEX.containsMatchIn(value)' in text
          assert 'if (looksLikeEdition(context)) return@forEach' not in text
          assert 'looksLikeEdition(context) && DATE_REGEX' not in text
          print('V307_EDITION_GUARD_OK=true')
          PY
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/GloboplayEditionCollector.kt
          git diff --cached --check
          git commit -m "fix: distinguir nome do telejornal de edição completa"
          git push origin HEAD:fix/v3.0.7-globoplay-editions-errors
