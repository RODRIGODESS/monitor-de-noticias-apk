name: v4.0.3 desktop compile check one-shot

on:
  push:
    branches:
      - "codex/windows/v4.0.3-portable"
    paths:
      - ".github/workflows/windows-v403-compilecheck-once.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile desktop Kotlin/Compose sources
        run: gradle :desktop:compileKotlin --stacktrace
