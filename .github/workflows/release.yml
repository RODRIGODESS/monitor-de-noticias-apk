name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/v4.0-news-latest-video-terms

      - name: Apply guarded v4.0 implementation patch
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: python3 tools/patch_v400.py

      - name: Verify v4.0 implementation patch
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          set -euo pipefail
          grep -q 'versionCode = 400' app/build.gradle.kts
          grep -q 'versionName = "4.0"' app/build.gradle.kts
          grep -q 'videoTerms: List<String>' app/src/main/java/br/com/monitordenoticias/android/VideoModels.kt
          grep -q 'VideoTermStore.load' app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          grep -q 'latestCollector.collect' app/src/main/java/br/com/monitordenoticias/android/NewsRepository.kt
          grep -q 'Termos de Notícias' app/src/main/java/br/com/monitordenoticias/android/MainActivityV28.kt
          grep -q 'Termos de Vídeos' app/src/main/java/br/com/monitordenoticias/android/MainActivityV28.kt
          grep -q 'tag_name: v4.0' .github/workflows/release.yml
          git diff --check

      - name: Commit v4.0 implementation
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/VideoModels.kt \
                  app/src/main/java/br/com/monitordenoticias/android/VideoViewModel.kt \
                  app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt \
                  app/src/main/java/br/com/monitordenoticias/android/NewsRepository.kt \
                  app/src/main/java/br/com/monitordenoticias/android/MainActivityV28.kt \
                  app/build.gradle.kts
          git commit -m "feat: implement v4.0 news discovery and split terms"
          git push origin HEAD:codex/v4.0-news-latest-video-terms

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Validate code on pull request
        if: github.event_name == 'pull_request'
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: permanent Android signing secrets are missing."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/monitor-noticias-release.jks
          test -s signing/monitor-noticias-release.jks

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/monitor-noticias-release.jks
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleRelease

      - name: Verify permanent signing certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          FINAL="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="signing/monitor-noticias-release.jks"
          EXPECTED_CERT="07164d3faf3ee09f241a547d403767c454b226faac26c4b058bc5011d773b1b0"

          "$APKSIGNER" verify --verbose "$FINAL"
          final_output=$("$APKSIGNER" verify --verbose --print-certs "$FINAL" 2>&1)
          printf '%s\n' "$final_output"

          extract_cert() {
            local output="$1"
            local line
            line=$(printf '%s\n' "$output" | grep -iE 'certificate.*sha-?256.*digest|sha-?256.*certificate.*digest' | head -1 || true)
            if [ -z "$line" ]; then
              line=$(printf '%s\n' "$output" | grep -iE 'sha-?256.*digest' | head -1 || true)
            fi
            printf '%s\n' "$line" | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ':[:space:]\r' | tr 'A-F' 'a-f'
          }

          FINAL_CERT=$(extract_cert "$final_output")
          KEYSTORE_CERT=$(keytool -list -v -keystore "$KEYSTORE" -alias monitor-noticias -storepass "$ANDROID_SIGNING_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":","",$2); gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')

          echo "Release certificate:  $FINAL_CERT"
          echo "Keystore certificate: $KEYSTORE_CERT"
          test -n "$FINAL_CERT"
          test -n "$KEYSTORE_CERT"
          test "$KEYSTORE_CERT" = "$EXPECTED_CERT"
          test "$FINAL_CERT" = "$EXPECTED_CERT"
          echo "PERMANENT_SIGNING_OK=true"

      - name: Prepare v3.0.12 release asset
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk monitor-de-noticias-v3.0.12.apk

      - name: Point v3.0.12 tag to validated main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v3.0.12 "$GITHUB_SHA"
          git push --force origin refs/tags/v3.0.12

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.12
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v3.0.12
          body: |
            Monitor de Notícias Android v3.0.12 — correção das fontes instáveis observadas no teste real da v3.0.11.

            Fontes e rotas:
            - Jornal da Band e Brasil Urgente passam a usar as páginas atuais dos programas;
            - Balanço Geral SP usa diretamente a listagem atual de vídeos;
            - Domingo Espetacular aceita as rotas atuais /videos/ e /video/;
            - SBT News usa a página atual de vídeos/ao-vivo;
            - Band Brasília, Minas, Rio, Paraná e Bahia recebem fallback específico por praça.

            Diagnóstico de instabilidade:
            - uma única falha auxiliar de Globoplay • Trechos deixa de condenar a fonte inteira;
            - um fallback isolado de portal também deixa de marcar a fonte como instável;
            - fontes continuam sendo marcadas quando as rotas de aquisição realmente falham em conjunto;
            - isso reduz falsos positivos sem esconder falhas de rede/HTTP acionáveis.

            Compatibilidade:
            - versionCode 312 / versionName 3.0.12;
            - mesmo applicationId br.com.monitordenoticias.android;
            - mesma assinatura permanente validada pelo certificado SHA-256 esperado;
            - instalação direta sobre v3.0.11 preservando Termos, Demandas, histórico, seleção de fontes e configurações.
          files: monitor-de-noticias-v3.0.12.apk
          overwrite_files: true
          make_latest: true
