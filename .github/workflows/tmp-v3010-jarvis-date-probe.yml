name: TEMP v3.0.10 Jarvis date probe

on:
  push:
    branches:
      - fix/v3.0.10-jarvis-dates-source-health

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe direct Globoplay pages for hidden dates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request, urllib.error
          ids=['14938964','14940098']
          ua='Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Mobile Safari/537.36'
          patterns=[
            r'2026-09-0[678][^"< ]{0,30}',
            r'0[678]/09/2026',
            r'(?i)(datePublished|uploadDate|dateCreated|publishedAt|publicationDate|publishedDate|exhibitionDate|airDate|airedAt|releaseDate|originalReleaseDate|startDate|endDate)[^\n]{0,180}',
            r'(?i)(created_at|published_at|publication_date|exhibition_date|air_date)[^\n]{0,180}',
          ]
          for vid in ids:
            url=f'https://globoplay.globo.com/v/{vid}/'
            print('\n===',url,'===')
            req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept-Language':'pt-BR,pt;q=0.9','Referer':'https://globoplay.globo.com/'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                html=r.read().decode('utf-8','ignore')
                print('STATUS',r.status,'LEN',len(html),'FINAL',r.geturl())
            except Exception as e:
              print('HTTP_EXCEPTION',repr(e)); continue
            print('HAS_HEADLINE', 'Veja os desfiles de 7 de setembro pelo país' in html or 'Comemorações do 7 de setembro' in html)
            for p in patterns:
              hits=[]
              for m in re.finditer(p,html):
                s=max(0,m.start()-80); e=min(len(html),m.end()+120)
                snippet=re.sub(r'\s+',' ',html[s:e])
                if snippet not in hits: hits.append(snippet)
                if len(hits)>=12: break
              print('PATTERN',p,'COUNT',len(hits))
              for h in hits: print('HIT',h[:500])
          PY
