name: TEMP Probe JH JN raw HTML

on:
  push:
    branches:
      - fix/v3.0.9-national-globoplay-diagnostics-layout

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Jornal Hoje target variants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time
          endpoint='https://cloud-jarvis.globo.com/graphql'
          headers={'content-type':'application/json','x-platform-id':'web','x-device-id':'desktop','x-client-version':'2024.12-5','user-agent':'Mozilla/5.0'}
          doc='''query Probe($q:String!,$page:Int) { search { videos(query:$q,page:$page) { page nextPage total hasNextPage resources { id headline description duration title { headline originProgramId } } } } }'''
          queries=['desfiles pelo país','desfiles pelo pais','desfiles 7 setembro país','desfiles 7 setembro pais','veja desfiles 7 setembro','desfile setembro país','desfile 7 setembro pais']
          for q in queries:
            print('===',q,'===')
            for attempt in range(1,3):
              body={'operationName':'Probe','variables':{'q':q,'page':1},'query':doc}
              req=urllib.request.Request(endpoint,data=json.dumps(body).encode(),headers=headers,method='POST')
              try:
                with urllib.request.urlopen(req,timeout=30) as r: raw=r.read().decode()
              except urllib.error.HTTPError as e: raw=e.read().decode()
              except Exception as e:
                print('ATTEMPT',attempt,'HTTP_EXCEPTION',repr(e)); time.sleep(1); continue
              d=json.loads(raw)
              if d.get('errors'):
                print('ATTEMPT',attempt,'ERRORS=',d['errors']); time.sleep(1); continue
              c=d['data']['search']['videos']; resources=c.get('resources') or []
              print('ATTEMPT',attempt,'TOTAL=',c.get('total'),'COUNT=',len(resources))
              for v in resources:
                h=(v.get('headline') or '').lower()
                program=(v.get('title') or {}).get('headline','')
                if program=='Jornal Hoje' or ('desfil' in h and 'setembro' in h):
                  print('MATCH=',json.dumps(v,ensure_ascii=False))
              break
          PY
