name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Validate code on pull request
        if: github.event_name == 'pull_request'
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: permanent Android signing secrets are missing."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/monitor-noticias-release.jks
          test -s signing/monitor-noticias-release.jks

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/monitor-noticias-release.jks
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleRelease

      - name: Verify permanent signing certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          FINAL="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="signing/monitor-noticias-release.jks"
          EXPECTED_CERT="07164d3faf3ee09f241a547d403767c454b226faac26c4b058bc5011d773b1b0"

          "$APKSIGNER" verify --verbose "$FINAL"
          final_output=$("$APKSIGNER" verify --verbose --print-certs "$FINAL" 2>&1)
          printf '%s\n' "$final_output"

          extract_cert() {
            local output="$1"
            local line
            line=$(printf '%s\n' "$output" | grep -iE 'certificate.*sha-?256.*digest|sha-?256.*certificate.*digest' | head -1 || true)
            if [ -z "$line" ]; then
              line=$(printf '%s\n' "$output" | grep -iE 'sha-?256.*digest' | head -1 || true)
            fi
            printf '%s\n' "$line" | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ':[:space:]\r' | tr 'A-F' 'a-f'
          }

          FINAL_CERT=$(extract_cert "$final_output")
          KEYSTORE_CERT=$(keytool -list -v -keystore "$KEYSTORE" -alias monitor-noticias -storepass "$ANDROID_SIGNING_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":","",$2); gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')

          echo "Release certificate:  $FINAL_CERT"
          echo "Keystore certificate: $KEYSTORE_CERT"
          test -n "$FINAL_CERT"
          test -n "$KEYSTORE_CERT"
          test "$KEYSTORE_CERT" = "$EXPECTED_CERT"
          test "$FINAL_CERT" = "$EXPECTED_CERT"
          echo "PERMANENT_SIGNING_OK=true"

      - name: Prepare v2.9.0 release asset
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk monitor-de-noticias-v2.9.0.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9.0
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v2.9.0
          body: |
            Versão 2.9.0 do Monitor de Notícias Android.

            Qualidade dos Termos:
            - siglas e termos curtos passam a exigir palavra inteira;
            - corrige falsos positivos como FAB dentro da palavra "fábrica";
            - notícias e vídeos passam por validação local antes de receber um Termo;
            - o histórico de vídeos é revalidado e associações antigas incorretas são removidas automaticamente.

            Monitor de Vídeos:
            - adiciona ação Limpar com confirmação, preservando Termos, Demandas e fontes;
            - adiciona pesquisa por período com Hoje, 24 horas, 7 dias e 30 dias, além de data/hora personalizada;
            - período fica salvo no aparelho e combina resultados capturados com o histórico público disponibilizado pelas plataformas;
            - seleção de fontes redesenhada no padrão das Notícias: Nacionais / Estados, Região, UF, pesquisa, Selecionar e Limpar visíveis;
            - mantém links diretos, deduplicação, Demandas e busca automática aproximadamente a cada 1 hora.

            Globo / Globoplay:
            - amplia o catálogo para Bom Dia e principais 1ª/2ª edições regionais de todas as UFs, incluindo afiliadas relevantes;
            - a varredura de telejornais abre edições recentes e expande a seção de Trechos para localizar matérias individuais;
            - novas fontes regionais ficam disponíveis para seleção por Região/UF e não são ativadas em massa automaticamente, evitando excesso de consultas em segundo plano.

            YouTube e demais fontes:
            - mantém CNN Brasil, Jovem Pan News, GloboNews, Record News, Jornal da Record, Band Jornalismo/BandNews e SBT News no YouTube;
            - mantém R7/Record, CNN, SBT, Band e fontes regionais já cadastradas.

            Atualização:
            - versionCode 290 / versionName 2.9.0;
            - mesmo applicationId e mesma assinatura permanente da linha v2.5+;
            - instalação direta sobre v2.8.4 preservando dados e configurações.
          files: monitor-de-noticias-v2.9.0.apk
          make_latest: true
