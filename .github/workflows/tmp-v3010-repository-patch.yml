name: TEMP v3010 repository patch

on:
  push:
    branches:
      - fix/v3.0.10-jarvis-dates-source-health

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.10-jarvis-dates-source-health
      - name: Patch repository health semantics and direct dates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt')
          text = p.read_text()

          # Edition discovery performs several speculative requests. A failure there
          # is not enough to classify the whole source as unstable; Trechos/fallback
          # still provide the actual health signal.
          text = text.replace(
              '''            val editionTrechos = globoplayEditionCollector.collect(source, capturedAt, from, to) {\n                onError("Globoplay • Edições")\n            }''',
              '''            val editionTrechos = globoplayEditionCollector.collect(source, capturedAt, from, to) {\n                // Rota auxiliar de descoberta: falha isolada não torna a fonte instável.\n            }'''
          )

          # Traditional portals: count network instability only when BOTH search and
          # landing fallback fail. A failed search URL followed by a working page is
          # not an unstable source.
          start = text.index('    private fun collectCandidatesForQuery(')
          end = text.index('\n    private fun prioritizeGloboplayCandidates(', start)
          replacement = r'''    private fun collectCandidatesForQuery(
        source: VideoSource,
        query: String,
        capturedAt: Long,
        onError: () -> Unit
    ): List<VideoItem> {
        var searchFailed = false
        val searched = if (source.searchUrlTemplate.isNotBlank()) {
            runCatching { fetchSearchWebsite(source, query, capturedAt) }
                .onFailure { searchFailed = true }
                .getOrDefault(emptyList())
        } else {
            emptyList()
        }

        val filtered = searched.filter { item -> phraseMatches("${item.title} ${item.summary}", query) }
        if (filtered.isNotEmpty()) return filtered.distinctBy { canonicalKey(it.link) }

        var fallbackFailed = false
        val fallback = runCatching { fetchWebsite(source, capturedAt) }
            .onFailure { fallbackFailed = true }
            .getOrDefault(emptyList())

        if (fallbackFailed && (searchFailed || source.searchUrlTemplate.isBlank())) onError()

        return fallback
            .filter { item -> phraseMatches("${item.title} ${item.summary}", query) }
            .distinctBy { canonicalKey(it.link) }
    }
'''
          text = text[:start] + replacement + text[end:]

          # Use the same policy live and in DB repair.
          start = text.index('    private fun phraseMatches(text: String, phrase: String): Boolean {')
          end = text.index('\n    private fun tokenEquivalent(', start)
          replacement = r'''    private fun phraseMatches(text: String, phrase: String): Boolean {
        if (normalize(phrase).isBlank()) return true
        return VideoMatchPolicy.phraseMatches(text, phrase)
    }
'''
          text = text[:start] + replacement + text[end:]

          # For all direct Globoplay pages, bind dates to the current /v/<id> rather
          # than accepting the first datePublished from a related video in the HTML.
          old_call = '        val publishedAt = parsePublishedAt(doc, capturedAt) ?: candidate.publishedAt.takeIf { it > 0 } ?: 0L\n'
          if old_call in text:
              text = text.replace(
                  old_call,
                  '        val publishedAt = parsePublishedAt(doc, capturedAt, canonical) ?: candidate.publishedAt.takeIf { it > 0 } ?: 0L\n',
                  1
              )

          old_sig = '    private fun parsePublishedAt(doc: Document, capturedAt: Long): Long? {'
          if old_sig in text:
              start = text.index(old_sig)
              end = text.index('\n    private fun fetchYoutube(', start)
              replacement = r'''    private fun parsePublishedAt(doc: Document, capturedAt: Long, targetUrl: String = ""): Long? {
        fun parseDate(value: String): Long? = runCatching {
            Instant.parse(value.trim()).toEpochMilli()
        }.getOrNull()?.takeIf { it in 1..capturedAt }

        listOf(
            doc.selectFirst("meta[property=article:published_time]")?.attr("content").orEmpty(),
            doc.selectFirst("meta[property=og:published_time]")?.attr("content").orEmpty(),
            doc.selectFirst("meta[name=date]")?.attr("content").orEmpty(),
            doc.selectFirst("meta[itemprop=datePublished]")?.attr("content").orEmpty(),
            doc.selectFirst("time[datetime]")?.attr("datetime").orEmpty()
        ).filter { it.isNotBlank() }.forEach { value ->
            parseDate(value)?.let { return it }
        }

        val targetVideoId = GLOBOPLAY_VIDEO_LINK_REGEX.find(targetUrl)?.groupValues?.getOrNull(1).orEmpty()
        if (targetVideoId.isNotBlank()) {
            var bestDate: Long? = null
            var bestDistance = Int.MAX_VALUE
            doc.select("script[type=application/ld+json], script").take(100).forEach { script ->
                val scriptText = normalizeEmbeddedScriptText(script.data().ifBlank { script.html() })
                val markers = linkedSetOf<Int>()
                listOf("\"id\":$targetVideoId", "\"id\":\"$targetVideoId\"", "/v/$targetVideoId/").forEach { marker ->
                    var fromIndex = 0
                    while (fromIndex < scriptText.length && markers.size < 24) {
                        val index = scriptText.indexOf(marker, fromIndex, ignoreCase = true)
                        if (index < 0) break
                        markers += index
                        fromIndex = index + marker.length
                    }
                }
                if (markers.isEmpty()) return@forEach
                JSON_DATE_REGEX.findAll(scriptText).take(120).forEach { match ->
                    val parsed = parseDate(match.groupValues[1]) ?: return@forEach
                    val distance = markers.minOf { marker -> kotlin.math.abs(match.range.first - marker) }
                    if (distance <= TARGET_VIDEO_DATE_CONTEXT_CHARS && distance < bestDistance) {
                        bestDistance = distance
                        bestDate = parsed
                    }
                }
            }
            bestDate?.let { return it }
        }

        val values = mutableListOf<String>()
        doc.select("script[type=application/ld+json], script").take(80).forEach { script ->
            val scriptText = normalizeEmbeddedScriptText(script.data().ifBlank { script.html() })
            JSON_DATE_REGEX.findAll(scriptText).take(12).forEach { match ->
                if (match.groupValues[1].isNotBlank()) values += match.groupValues[1]
            }
        }
        values.distinct().forEach { value -> parseDate(value)?.let { return it } }
        return null
    }
'''
              text = text[:start] + replacement + text[end:]

          text = text.replace(
              '"\\\"(?:datePublished|uploadDate|dateCreated|publishedAt|publicationDate|publishedDate)\\\"\\s*:\\s*\\\"([^\\\"]+)\\\"",',
              '"\\\"(?:datePublished|uploadDate|dateCreated|publishedAt|publicationDate|publishedDate|exhibitedAt)\\\"\\s*:\\s*\\\"([^\\\"]+)\\\"",'
          )
          if 'TARGET_VIDEO_DATE_CONTEXT_CHARS' not in text[text.index('    companion object {'):]:
              text = text.replace(
                  '        private const val MAX_ENRICHED_SUMMARY_LENGTH = 1800\n',
                  '        private const val MAX_ENRICHED_SUMMARY_LENGTH = 1800\n        private const val TARGET_VIDEO_DATE_CONTEXT_CHARS = 4_000\n'
              )

          p.write_text(text)
          PY
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/tmp-v3010-repository-patch.yml
          rm -f .github/workflows/tmp-v3010-apply-core.yml
          rm -f .github/workflows/tmp-v3010-jarvis-date-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize video health diagnostics and direct Globoplay dates"
          git push origin HEAD:fix/v3.0.10-jarvis-dates-source-health
