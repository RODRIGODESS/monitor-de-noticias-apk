name: Apply v3.0.4 guarded patch

on:
  push:
    branches: ["fix/v3.0.4-globoplay-clear"]
    paths: [".github/workflows/temp-v304-patch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v3.0.4-globoplay-clear
          fetch-depth: 0

      - name: Apply guarded v3.0.4 changes
        shell: bash
        run: |
          cat > /tmp/patch_v304.py <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def block(lines):
              return "\n".join(lines) + "\n"

          def replace_span(path, start, end, replacement, label):
              text = read(path)
              s = text.find(start)
              if s < 0:
                  raise SystemExit(f"{label}: start marker not found")
              e = text.find(end, s)
              if e < 0:
                  raise SystemExit(f"{label}: end marker not found")
              write(path, text[:s] + replacement + text[e:])
              print(f"patched: {label}")

          def replace_once(path, old, new, label):
              text = read(path)
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              write(path, text.replace(old, new, 1))
              print(f"patched: {label}")

          collector = "app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt"
          discovery = block([
              "        val programPages = linkedMapOf<String, Int>()",
              "",
              "        // Rotas estáveis confirmadas entram antes da busca dinâmica do Globoplay.",
              "        KNOWN_PROGRAM_PAGES[source.id]?.let { programPages[it] = Int.MAX_VALUE }",
              "",
              "        // Se a fonte já for uma página /programa/t/<token>, use-a diretamente.",
              "        normalizeProgramPage(source.landingUrl)?.let { programPages[it] = Int.MAX_VALUE - 1 }",
              "",
              "        // Landings históricas /v/<id> servem apenas como sementes para descobrir",
              "        // a página estável do programa. O vídeo antigo não vira resultado recorrente.",
              "        if (programPages.isEmpty() && normalizeDirectVideoUrl(source.landingUrl) != null) {",
              "            val seedDoc = runCatching { fetchDocument(source.landingUrl) }",
              "                .onFailure { onError() }",
              "                .getOrNull()",
              "            if (seedDoc != null) {",
              "                extractProgramPages(source, seedDoc, source.landingUrl)",
              "                    .forEach { (url, score) ->",
              "                        programPages[url] = maxOf(programPages[url] ?: Int.MIN_VALUE, score)",
              "                    }",
              "            }",
              "        }",
              "",
              "        // A busca geral fica como último recurso de descoberta.",
              "        if (programPages.isEmpty()) {",
              "            val discoveryUrl = buildDiscoveryUrl(source)",
              "            val discoveryDoc = runCatching { fetchDocument(discoveryUrl) }",
              "                .onFailure { onError() }",
              "                .getOrNull()",
              "",
              "            if (discoveryDoc != null) {",
              "                extractProgramPages(source, discoveryDoc, discoveryUrl)",
              "                    .forEach { (url, score) ->",
              "                        programPages[url] = maxOf(programPages[url] ?: Int.MIN_VALUE, score)",
              "                    }",
              "",
              "                if (programPages.isEmpty()) {",
              "                    extractDirectVideoLinks(discoveryDoc, discoveryUrl)",
              "                        .take(MAX_SEED_VIDEOS)",
              "                        .forEach { seed ->",
              "                            val seedDoc = runCatching { fetchDocument(seed) }",
              "                                .onFailure { onError() }",
              "                                .getOrNull()",
              "                                ?: return@forEach",
              "                            extractProgramPages(source, seedDoc, seed)",
              "                                .forEach { (url, score) ->",
              "                                    programPages[url] = maxOf(programPages[url] ?: Int.MIN_VALUE, score)",
              "                                }",
              "                        }",
              "                }",
              "            }",
              "        }",
              "",
          ])
          replace_span(
              collector,
              "        val programPages = linkedMapOf<String, Int>()",
              "        if (programPages.isEmpty()) return emptyList()",
              discovery,
              "Globoplay stable/seed discovery",
          )

          fetch_doc = block([
              "    private fun fetchDocument(url: String): Document = Jsoup.connect(url)",
              "        .userAgent(USER_AGENT)",
              "        .header(\"Accept-Language\", \"pt-BR,pt;q=0.9,en;q=0.7\")",
              "        .referrer(\"https://www.google.com/\")",
              "        .timeout(REQUEST_TIMEOUT_MS)",
              "        .maxBodySize(MAX_HTML_BODY_BYTES)",
              "        .followRedirects(true)",
              "        .get()",
              "",
          ])
          replace_span(
              collector,
              "    private fun fetchDocument(url: String): Document = Jsoup.connect(url)",
              "    private fun extractProgramPages(",
              fetch_doc,
              "Globoplay browser/full HTML request",
          )

          collector_text = read(collector)
          old = '        private const val USER_AGENT = "Mozilla/5.0 (Linux; Android 14) MonitorNoticias/3.0.3"\n        private const val REQUEST_TIMEOUT_MS = 14_000\n        private const val MAX_PROGRAM_PAGES_PER_SOURCE = 2'
          new = block([
              '        private const val USER_AGENT = "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Mobile Safari/537.36"',
              "        private const val REQUEST_TIMEOUT_MS = 14_000",
              "        private const val MAX_HTML_BODY_BYTES = 8 * 1024 * 1024",
              "        private const val MAX_PROGRAM_PAGES_PER_SOURCE = 2",
              "",
              "        private val KNOWN_PROGRAM_PAGES = mapOf(",
              '            "globoplay-bom-dia-brasil" to "https://globoplay.globo.com/bom-dia-brasil/t/6Qg1RywhG5",',
              '            "globoplay-hora-1" to "https://globoplay.globo.com/hora-1/t/s1Zp7Mf9Mn",',
              '            "globoplay-jornal-hoje" to "https://globoplay.globo.com/jornal-hoje/t/w7R6S8ssrm",',
              '            "globoplay-jornal-nacional" to "https://globoplay.globo.com/jornal-nacional/t/QgkQnhBNnR",',
              '            "globoplay-jornal-da-globo" to "https://globoplay.globo.com/jornal-da-globo/t/N6jszcBg6m",',
              '            "globoplay-rj1" to "https://globoplay.globo.com/rj1/t/hcSthQ56JW",',
              '            "globoplay-rj2" to "https://globoplay.globo.com/rj2/t/x5SwXtgSZn",',
              '            "globoplay-sp1" to "https://globoplay.globo.com/sp1/t/MvdbFs2kN8",',
              '            "globoplay-sp2" to "https://globoplay.globo.com/sp2/t/xbFtFNTP81",',
              '            "globoplay-bom-dia-es" to "https://globoplay.globo.com/bom-dia-es/t/DLBLDnCVGs",',
              '            "globoplay-tj1-tapajos" to "https://globoplay.globo.com/jornal-tapajos-1a-edicao/t/hTwfdtmDCQ"',
              "        )",
          ]).rstrip("\n")
          if collector_text.count(old) != 1:
              raise SystemExit(f"Globoplay constants expected 1 match, got {collector_text.count(old)}")
          write(collector, collector_text.replace(old, new, 1))
          print("patched: known Globoplay program routes")

          matching_helpers = block([
              "    private fun phraseMatches(text: String, phrase: String): Boolean {",
              "        val haystack = normalize(text)",
              "        val wanted = normalize(phrase)",
              "        if (wanted.isBlank()) return true",
              "",
              "        val hayTokens = haystack.split(' ').filter { it.isNotBlank() }.toSet()",
              "        val wantedTokens = wanted.split(' ').filter { it.isNotBlank() }",
              "        if (wantedTokens.isEmpty()) return false",
              "        if (wantedTokens.size == 1) return hayTokens.any { tokenEquivalent(it, wantedTokens.first()) }",
              "        if (\" $haystack \".contains(\" $wanted \")) return true",
              "",
              "        val meaningful = wantedTokens.filter { it.length >= 3 && it !in STOP_WORDS }",
              "        return meaningful.isNotEmpty() && meaningful.all { wantedToken ->",
              "            hayTokens.any { actualToken -> tokenEquivalent(actualToken, wantedToken) }",
              "        }",
              "    }",
              "",
              "    private fun tokenEquivalent(actual: String, wanted: String): Boolean {",
              "        if (actual == wanted) return true",
              "        if (actual.length < 5 || wanted.length < 5) return false",
              "        return actual in inflectionVariants(wanted) || wanted in inflectionVariants(actual)",
              "    }",
              "",
              "    private fun inflectionVariants(token: String): Set<String> = buildSet {",
              "        add(token)",
              "        when {",
              '            token.endsWith("r") -> add(token + "es")',
              '            token.endsWith("l") -> add(token.dropLast(1) + "is")',
              '            token.endsWith("m") -> add(token.dropLast(1) + "ns")',
              '            token.endsWith("ao") -> {',
              '                add(token.dropLast(2) + "oes")',
              '                add(token.dropLast(2) + "aes")',
              '                add(token.dropLast(2) + "aos")',
              "            }",
              '            !token.endsWith("s") -> add(token + "s")',
              "        }",
              "        when {",
              '            token.endsWith("res") && token.length > 5 -> add(token.dropLast(2))',
              '            token.endsWith("is") && token.length > 5 -> add(token.dropLast(2) + "l")',
              '            token.endsWith("ns") && token.length > 5 -> add(token.dropLast(2) + "m")',
              '            token.endsWith("s") && token.length > 5 -> add(token.dropLast(1))',
              "        }",
              "    }",
              "",
          ])

          repo = "app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt"
          replace_span(repo, "    private fun phraseMatches(text: String, phrase: String): Boolean {", "    private fun inPeriod(", matching_helpers, "safe singular/plural matching")

          repo_text = read(repo)
          listing_old = block([
              "        val doc = Jsoup.connect(pageUrl)",
              '            .userAgent("Mozilla/5.0 (Linux; Android 14) MonitorNoticias/3.0.3")',
              '            .referrer("https://www.google.com/")',
              "            .timeout(14_000)",
              "            .followRedirects(true)",
              "            .get()",
          ])
          listing_new = block([
              "        val doc = Jsoup.connect(pageUrl)",
              "            .userAgent(BROWSER_USER_AGENT)",
              '            .header("Accept-Language", "pt-BR,pt;q=0.9,en;q=0.7")',
              '            .referrer("https://www.google.com/")',
              "            .timeout(14_000)",
              "            .maxBodySize(MAX_HTML_BODY_BYTES)",
              "            .followRedirects(true)",
              "            .get()",
          ])
          if repo_text.count(listing_old) != 1:
              raise SystemExit(f"listing request expected 1, got {repo_text.count(listing_old)}")
          repo_text = repo_text.replace(listing_old, listing_new, 1)
          direct_old = block([
              "        val doc = Jsoup.connect(candidate.link)",
              '            .userAgent("Mozilla/5.0 (Linux; Android 14) MonitorNoticias/3.0.3")',
              "            .referrer(source.landingUrl)",
              "            .timeout(14_000)",
              "            .followRedirects(true)",
              "            .get()",
          ])
          direct_new = block([
              "        val doc = Jsoup.connect(candidate.link)",
              "            .userAgent(BROWSER_USER_AGENT)",
              '            .header("Accept-Language", "pt-BR,pt;q=0.9,en;q=0.7")',
              "            .referrer(source.landingUrl)",
              "            .timeout(14_000)",
              "            .maxBodySize(MAX_HTML_BODY_BYTES)",
              "            .followRedirects(true)",
              "            .get()",
          ])
          if repo_text.count(direct_old) != 1:
              raise SystemExit(f"direct request expected 1, got {repo_text.count(direct_old)}")
          repo_text = repo_text.replace(direct_old, direct_new, 1)
          constants_old = "        private const val MAX_RESOLVED_PER_QUERY = 8\n        private const val MAX_GLOBOPLAY_ITEMS_PER_SCAN = 24"
          constants_new = block([
              '        private const val BROWSER_USER_AGENT = "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Mobile Safari/537.36"',
              "        private const val MAX_HTML_BODY_BYTES = 8 * 1024 * 1024",
              "        private const val MAX_RESOLVED_PER_QUERY = 8",
              "        private const val MAX_GLOBOPLAY_ITEMS_PER_SCAN = 24",
          ]).rstrip("\n")
          if repo_text.count(constants_old) != 1:
              raise SystemExit("repo constants marker not unique")
          write(repo, repo_text.replace(constants_old, constants_new, 1))
          print("patched: VideoRepository browser/full HTML requests")

          db = "app/src/main/java/br/com/monitordenoticias/android/VideoDb.kt"
          db_match = matching_helpers.replace("private fun phraseMatches(", "private fun phraseMatchesStrict(").replace("if (wanted.isBlank()) return true", "if (wanted.isBlank()) return false")
          replace_span(db, "    private fun phraseMatchesStrict(text: String, phrase: String): Boolean {", "    private fun normalize(", db_match, "DB repair singular/plural matching")

          ui = "app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt"
          ui_text = read(ui)
          anchor = block([
              "                        FilledIconButton(onClick = vm::searchNow, enabled = !s.busy, modifier = Modifier.size(44.dp)) {",
              '                            Icon(if (s.busy) Icons.Outlined.HourglassTop else Icons.Outlined.Refresh, "Buscar vídeos")',
              "                        }",
              "                    }",
          ])
          visible_clear = anchor + block([
              "                    Spacer(Modifier.height(10.dp))",
              "                    OutlinedButton(",
              "                        onClick = { confirmClear = true },",
              "                        enabled = !s.busy && s.totalStored > 0,",
              "                        modifier = Modifier.fillMaxWidth().height(42.dp),",
              "                        border = BorderStroke(1.dp, V30Red.copy(alpha = .38f)),",
              "                        colors = ButtonDefaults.outlinedButtonColors(contentColor = V30Red)",
              "                    ) {",
              "                        Icon(Icons.Outlined.DeleteSweep, null, modifier = Modifier.size(18.dp))",
              "                        Spacer(Modifier.width(7.dp))",
              '                        Text("Limpar vídeos")',
              "                    }",
          ])
          if ui_text.count(anchor) != 1:
              raise SystemExit(f"UI top card anchor expected 1, got {ui_text.count(anchor)}")
          ui_text = ui_text.replace(anchor, visible_clear, 1)
          hidden = '                V30Chip("Limpar", false) { confirmClear = true }\n'
          if ui_text.count(hidden) != 1:
              raise SystemExit(f"hidden clear chip expected 1, got {ui_text.count(hidden)}")
          write(ui, ui_text.replace(hidden, "", 1))
          print("patched: visible Limpar vídeos button")

          gradle = "app/build.gradle.kts"
          replace_once(gradle, '        versionCode = 303\n        versionName = "3.0.3"', '        versionCode = 304\n        versionName = "3.0.4"', "version 3.0.4")

          release = ".github/workflows/release.yml"
          release_text = read(release)
          if "v3.0.3" not in release_text:
              raise SystemExit("release v3.0.3 markers missing")
          release_text = release_text.replace("v3.0.3", "v3.0.4")
          release_text = release_text.replace("versionCode 303 / versionName 3.0.4", "versionCode 304 / versionName 3.0.4")
          release_text = release_text.replace(
              "Monitor de Notícias Android v3.0.4 — Globoplay Trechos mais robusto e sincronização das notícias automáticas.",
              "Monitor de Notícias Android v3.0.4 — Globoplay com rotas estáveis, flexões seguras e Limpar vídeos visível.",
          )
          release_text = release_text.replace(
              "            Globoplay / telejornais:\n",
              "            Globoplay / telejornais:\n            - rotas estáveis conhecidas de telejornais prioritários entram antes da busca dinâmica;\n            - landings históricas /v/<id> servem como sementes de descoberta da página real, sem virar resultados recorrentes;\n            - requisições usam perfil de navegador e HTML ampliado para capturar cards/JSON completos;\n            - Termos usam flexões conservadoras como militar/militares e naval/navais, mantendo tokens curtos como FAB exatos;\n",
              1,
          )
          release_text = release_text.replace(
              "            Monitor de Vídeos e agenda:\n",
              "            Monitor de Vídeos e agenda:\n            - botão Limpar vídeos fica visível no card principal e apaga somente o histórico após confirmação;\n",
              1,
          )
          release_text = release_text.replace("instalação direta sobre v3.0.2", "instalação direta sobre v3.0.3")
          write(release, release_text)
          print("patched: v3.0.4 release workflow")
          PY
          python3 /tmp/patch_v304.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 304' app/build.gradle.kts
          grep -q 'versionName = "3.0.4"' app/build.gradle.kts
          grep -q 'globoplay-rj1.*hcSthQ56JW' app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt
          grep -q 'tokenEquivalent' app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          grep -q 'tokenEquivalent' app/src/main/java/br/com/monitordenoticias/android/VideoDb.kt
          grep -q 'Text("Limpar vídeos")' app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt
          ! grep -q 'V30Chip("Limpar"' app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt
          grep -q 'tag_name: v3.0.4' .github/workflows/release.yml

      - name: Commit app changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RODRIGODESS"
          git config user.email "diguinhodess@gmail.com"
          git add app/build.gradle.kts .github/workflows/release.yml app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt app/src/main/java/br/com/monitordenoticias/android/VideoDb.kt app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt
          git commit -m "fix: encontrar Globoplay e expor limpar vídeos"
          git push origin HEAD:fix/v3.0.4-globoplay-clear