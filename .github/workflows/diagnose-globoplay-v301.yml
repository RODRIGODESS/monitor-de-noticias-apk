name: Diagnose Globoplay v3.0.1

on:
  push:
    branches: ["fix/v3.0.1-video-scan-and-demand-alerts"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Globoplay embedded metadata
        run: |
          set -u
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'
          url='https://globoplay.globo.com/v/14938901/'
          curl -L --max-time 20 -A "$UA" -o /tmp/page.html -sS "$url" || true
          echo "bytes=$(wc -c < /tmp/page.html)"
          grep -Eio '<meta[^>]+(og:title|og:description|keywords|article:tag|video:tag)[^>]*>' /tmp/page.html | head -20 || true
          echo '--- identifiers ---'
          grep -Eo '"(programId|program_id|program|editorialId|editorial_id|contentId|content_id|videoId|video_id|slug|title|headline)"[[:space:]]*:[[:space:]]*("[^"]{1,180}"|[0-9]+)' /tmp/page.html | head -80 || true
          echo '--- api-like urls ---'
          grep -Eo 'https?[^" ]+(api|graphql|playlist|videos|content)[^" ]*' /tmp/page.html | sed 's/\\u002F/\//g;s/\\\//\//g' | head -60 || true
          echo '--- nearby video ids ---'
          grep -Eio '/v/[0-9]+' /tmp/page.html | sort -u | head -80 || true
