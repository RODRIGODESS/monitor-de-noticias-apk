name: Apply Windows v4.0.3 search coverage

on:
  push:
    branches:
      - codex/windows/v4.0.3-portable
    paths:
      - .github/workflows/v403-search-coverage-patch.yml
      - .github/scripts/v403_search_coverage_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/windows/v4.0.3-portable

      - name: Apply v4.0.3 search coverage patch
        run: python .github/scripts/v403_search_coverage_patch.py

      - name: Commit Windows v4.0.3 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DesktopController.kt desktop/src/main/kotlin/br/com/monitordenoticias/desktop/Main.kt desktop/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m "feat(windows 4.0.3): busca em camadas e diagnóstico de cobertura"
          git push origin HEAD:codex/windows/v4.0.3-portable
