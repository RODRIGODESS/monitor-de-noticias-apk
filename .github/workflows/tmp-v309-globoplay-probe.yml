name: TEMP Probe JH JN raw HTML

on:
  push:
    branches:
      - fix/v3.0.9-national-globoplay-diagnostics-layout

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public Globoplay GraphQL
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://cloud-jarvis.globo.com/graphql'
          COMMON=(-H 'content-type: application/json' -H 'x-platform-id: web' -H 'x-device-id: desktop' -H 'x-client-version: 2024.12-5')

          python3 - <<'PY' > video.json
          import json
          print(json.dumps({
            "operationName":"getVideoView",
            "variables":{"videoId":"14940098"},
            "query":"query getVideoView($videoId: ID!) { video(id: $videoId) { id duration description headline title { originProgramId headline } } }"
          }))
          PY
          curl -sS --fail --max-time 25 "${COMMON[@]}" --data @video.json "$ENDPOINT" -o video-response.json
          python3 - <<'PY'
          import json
          d=json.load(open('video-response.json'))
          print('VIDEO_RESPONSE=', json.dumps(d, ensure_ascii=False)[:3000])
          PY

          python3 - <<'PY' > schema.json
          import json
          print(json.dumps({
            "operationName":"ProbeSchema",
            "variables":{},
            "query":"query ProbeSchema { __schema { queryType { fields { name args { name } } } } }"
          }))
          PY
          set +e
          curl -sS --max-time 25 "${COMMON[@]}" --data @schema.json "$ENDPOINT" -o schema-response.json
          set -e
          python3 - <<'PY'
          import json
          try:
              d=json.load(open('schema-response.json'))
          except Exception as e:
              print('SCHEMA_PARSE_ERROR=',e); raise SystemExit
          fields=((d.get('data') or {}).get('__schema') or {}).get('queryType',{}).get('fields',[])
          print('SCHEMA_ERRORS=', d.get('errors'))
          print('QUERY_FIELDS=', [(f.get('name'), [a.get('name') for a in f.get('args',[])]) for f in fields][:300])
          PY
