name: Apply v3.0.4 guarded patch

on:
  push:
    branches: ["fix/v3.0.4-globoplay-clear"]
    paths: [".github/workflows/temp-v304-patch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v3.0.4-globoplay-clear
          fetch-depth: 0

      - name: Apply guarded v3.0.4 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match in {path}, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"patched: {label}")

          collector = "app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt"
          old_discovery = '''        val programPages = linkedMapOf<String, Int>()
          val directLandingProgram = normalizeProgramPage(source.landingUrl)
          if (directLandingProgram != null) {
              programPages[directLandingProgram] = Int.MAX_VALUE
          } else {
              val discoveryUrl = buildDiscoveryUrl(source)
              val discoveryDoc = runCatching { fetchDocument(discoveryUrl) }
                  .onFailure { onError() }
                  .getOrNull()

              if (discoveryDoc != null) {
                  extractProgramPages(source, discoveryDoc, discoveryUrl)
                      .forEach { (url, score) ->
                          programPages[url] = maxOf(programPages[url] ?: Int.MIN_VALUE, score)
                      }

                  if (programPages.isEmpty()) {
                      // Algumas versões da busca entregam apenas cards /v/<id> no HTML.
                      // Esses vídeos servem como sementes para descobrir o link do programa.
                      extractDirectVideoLinks(discoveryDoc, discoveryUrl)
                          .take(MAX_SEED_VIDEOS)
                          .forEach { seed ->
                              val seedDoc = runCatching { fetchDocument(seed) }
                                  .onFailure { onError() }
                                  .getOrNull()
                                  ?: return@forEach
                              extractProgramPages(source, seedDoc, seed)
                                  .forEach { (url, score) ->
                                      programPages[url] = maxOf(programPages[url] ?: Int.MIN_VALUE, score)
                                  }
                          }
                  }
              }
          }
          '''
          new_discovery = '''        val programPages = linkedMapOf<String, Int>()

          // Rotas estáveis confirmadas de telejornais importantes. Elas evitam depender da
          // busca dinâmica do Globoplay, que muda com frequência e é a maior fonte de falhas.
          KNOWN_PROGRAM_PAGES[source.id]?.let { programPages[it] = Int.MAX_VALUE }

          // Se a própria fonte já aponta para /programa/t/<token>, use diretamente.
          normalizeProgramPage(source.landingUrl)?.let { programPages[it] = Int.MAX_VALUE - 1 }

          // Várias fontes regionais já possuem um /v/<id> histórico confiável no catálogo.
          // Esse vídeo NÃO vira resultado recorrente: ele serve apenas como semente para
          // descobrir a página estável /t/<token> do programa.
          if (programPages.isEmpty() && normalizeDirectVideoUrl(source.landingUrl) != null) {
              val seedDoc = runCatching { fetchDocument(source.landingUrl) }
                  .onFailure { onError() }
                  .getOrNull()
              if (seedDoc != null) {
                  extractProgramPages(source, seedDoc, source.landingUrl)
                      .forEach { (url, score) ->
                          programPages[url] = maxOf(programPages[url] ?: Int.MIN_VALUE, score)
                      }
              }
          }

          // Busca geral somente como último recurso de descoberta do programa.
          if (programPages.isEmpty()) {
              val discoveryUrl = buildDiscoveryUrl(source)
              val discoveryDoc = runCatching { fetchDocument(discoveryUrl) }
                  .onFailure { onError() }
                  .getOrNull()

              if (discoveryDoc != null) {
                  extractProgramPages(source, discoveryDoc, discoveryUrl)
                      .forEach { (url, score) ->
                          programPages[url] = maxOf(programPages[url] ?: Int.MIN_VALUE, score)
                      }

                  if (programPages.isEmpty()) {
                      extractDirectVideoLinks(discoveryDoc, discoveryUrl)
                          .take(MAX_SEED_VIDEOS)
                          .forEach { seed ->
                              val seedDoc = runCatching { fetchDocument(seed) }
                                  .onFailure { onError() }
                                  .getOrNull()
                                  ?: return@forEach
                              extractProgramPages(source, seedDoc, seed)
                                  .forEach { (url, score) ->
                                      programPages[url] = maxOf(programPages[url] ?: Int.MIN_VALUE, score)
                                  }
                          }
                  }
              }
          }
          '''
          replace_once(collector, old_discovery, new_discovery, "Globoplay stable/seed discovery")

          old_fetch = '''    private fun fetchDocument(url: String): Document = Jsoup.connect(url)
              .userAgent(USER_AGENT)
              .referrer("https://www.google.com/")
              .timeout(REQUEST_TIMEOUT_MS)
              .followRedirects(true)
              .get()
          '''
          new_fetch = '''    private fun fetchDocument(url: String): Document = Jsoup.connect(url)
              .userAgent(USER_AGENT)
              .header("Accept-Language", "pt-BR,pt;q=0.9,en;q=0.7")
              .referrer("https://www.google.com/")
              .timeout(REQUEST_TIMEOUT_MS)
              .maxBodySize(MAX_HTML_BODY_BYTES)
              .followRedirects(true)
              .get()
          '''
          replace_once(collector, old_fetch, new_fetch, "Globoplay browser request")

          old_constants = '''        private const val USER_AGENT = "Mozilla/5.0 (Linux; Android 14) MonitorNoticias/3.0.3"
          private const val REQUEST_TIMEOUT_MS = 14_000
          private const val MAX_PROGRAM_PAGES_PER_SOURCE = 2
          '''
          new_constants = '''        private const val USER_AGENT = "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Mobile Safari/537.36"
          private const val REQUEST_TIMEOUT_MS = 14_000
          private const val MAX_HTML_BODY_BYTES = 8 * 1024 * 1024
          private const val MAX_PROGRAM_PAGES_PER_SOURCE = 2

          private val KNOWN_PROGRAM_PAGES = mapOf(
              "globoplay-bom-dia-brasil" to "https://globoplay.globo.com/bom-dia-brasil/t/6Qg1RywhG5",
              "globoplay-hora-1" to "https://globoplay.globo.com/hora-1/t/s1Zp7Mf9Mn",
              "globoplay-jornal-hoje" to "https://globoplay.globo.com/jornal-hoje/t/w7R6S8ssrm",
              "globoplay-jornal-nacional" to "https://globoplay.globo.com/jornal-nacional/t/QgkQnhBNnR",
              "globoplay-jornal-da-globo" to "https://globoplay.globo.com/jornal-da-globo/t/N6jszcBg6m",
              "globoplay-rj1" to "https://globoplay.globo.com/rj1/t/hcSthQ56JW",
              "globoplay-rj2" to "https://globoplay.globo.com/rj2/t/x5SwXtgSZn",
              "globoplay-sp1" to "https://globoplay.globo.com/sp1/t/MvdbFs2kN8",
              "globoplay-sp2" to "https://globoplay.globo.com/sp2/t/xbFtFNTP81",
              "globoplay-bom-dia-es" to "https://globoplay.globo.com/bom-dia-es/t/DLBLDnCVGs",
              "globoplay-tj1-tapajos" to "https://globoplay.globo.com/jornal-tapajos-1a-edicao/t/hTwfdtmDCQ"
          )
          '''
          replace_once(collector, old_constants, new_constants, "Globoplay known program pages")

          repo = "app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt"
          old_match = '''    private fun phraseMatches(text: String, phrase: String): Boolean {
              val haystack = normalize(text)
              val wanted = normalize(phrase)
              if (wanted.isBlank()) return true

              val hayTokens = haystack.split(' ').filter { it.isNotBlank() }.toSet()
              val wantedTokens = wanted.split(' ').filter { it.isNotBlank() }
              if (wantedTokens.isEmpty()) return false
              if (wantedTokens.size == 1) return wantedTokens.first() in hayTokens
              if (" $haystack ".contains(" $wanted ")) return true

              val meaningful = wantedTokens.filter { it.length >= 3 && it !in STOP_WORDS }
              return meaningful.isNotEmpty() && meaningful.all { it in hayTokens }
          }
          '''
          new_match = '''    private fun phraseMatches(text: String, phrase: String): Boolean {
              val haystack = normalize(text)
              val wanted = normalize(phrase)
              if (wanted.isBlank()) return true

              val hayTokens = haystack.split(' ').filter { it.isNotBlank() }.toSet()
              val wantedTokens = wanted.split(' ').filter { it.isNotBlank() }
              if (wantedTokens.isEmpty()) return false
              if (wantedTokens.size == 1) return hayTokens.any { tokenEquivalent(it, wantedTokens.first()) }
              if (" $haystack ".contains(" $wanted ")) return true

              val meaningful = wantedTokens.filter { it.length >= 3 && it !in STOP_WORDS }
              return meaningful.isNotEmpty() && meaningful.all { wantedToken ->
                  hayTokens.any { actualToken -> tokenEquivalent(actualToken, wantedToken) }
              }
          }

          /**
           * Flexão nominal extremamente conservadora para imprensa em português.
           * Corrige casos como militar/militares, naval/navais e navio/navios sem
           * reintroduzir o falso positivo histórico FAB/fábrica: tokens curtos (<5)
           * continuam exigindo igualdade exata.
           */
          private fun tokenEquivalent(actual: String, wanted: String): Boolean {
              if (actual == wanted) return true
              if (actual.length < 5 || wanted.length < 5) return false
              return actual in inflectionVariants(wanted) || wanted in inflectionVariants(actual)
          }

          private fun inflectionVariants(token: String): Set<String> = buildSet {
              add(token)
              when {
                  token.endsWith("r") -> add(token + "es")
                  token.endsWith("l") -> add(token.dropLast(1) + "is")
                  token.endsWith("m") -> add(token.dropLast(1) + "ns")
                  token.endsWith("ao") -> {
                      add(token.dropLast(2) + "oes")
                      add(token.dropLast(2) + "aes")
                      add(token.dropLast(2) + "aos")
                  }
                  !token.endsWith("s") -> add(token + "s")
              }
              when {
                  token.endsWith("res") && token.length > 5 -> add(token.dropLast(2))
                  token.endsWith("is") && token.length > 5 -> add(token.dropLast(2) + "l")
                  token.endsWith("ns") && token.length > 5 -> add(token.dropLast(2) + "m")
                  token.endsWith("s") && token.length > 5 -> add(token.dropLast(1))
              }
          }
          '''
          replace_once(repo, old_match, new_match, "safe Portuguese inflection matching")

          p = Path(repo)
          text = p.read_text(encoding="utf-8")
          old_request = '''        val doc = Jsoup.connect(pageUrl)
              .userAgent("Mozilla/5.0 (Linux; Android 14) MonitorNoticias/3.0.3")
              .referrer("https://www.google.com/")
              .timeout(14_000)
              .followRedirects(true)
              .get()
          '''
          new_request = '''        val doc = Jsoup.connect(pageUrl)
              .userAgent(BROWSER_USER_AGENT)
              .header("Accept-Language", "pt-BR,pt;q=0.9,en;q=0.7")
              .referrer("https://www.google.com/")
              .timeout(14_000)
              .maxBodySize(MAX_HTML_BODY_BYTES)
              .followRedirects(true)
              .get()
          '''
          if text.count(old_request) != 1:
              raise SystemExit(f"VideoRepository listing request expected 1, got {text.count(old_request)}")
          text = text.replace(old_request, new_request, 1)

          old_direct = '''        val doc = Jsoup.connect(candidate.link)
              .userAgent("Mozilla/5.0 (Linux; Android 14) MonitorNoticias/3.0.3")
              .referrer(source.landingUrl)
              .timeout(14_000)
              .followRedirects(true)
              .get()
          '''
          new_direct = '''        val doc = Jsoup.connect(candidate.link)
              .userAgent(BROWSER_USER_AGENT)
              .header("Accept-Language", "pt-BR,pt;q=0.9,en;q=0.7")
              .referrer(source.landingUrl)
              .timeout(14_000)
              .maxBodySize(MAX_HTML_BODY_BYTES)
              .followRedirects(true)
              .get()
          '''
          if text.count(old_direct) != 1:
              raise SystemExit(f"VideoRepository direct request expected 1, got {text.count(old_direct)}")
          text = text.replace(old_direct, new_direct, 1)

          old_repo_constants = '''        private const val MAX_RESOLVED_PER_QUERY = 8
          private const val MAX_GLOBOPLAY_ITEMS_PER_SCAN = 24
          '''
          new_repo_constants = '''        private const val BROWSER_USER_AGENT = "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Mobile Safari/537.36"
          private const val MAX_HTML_BODY_BYTES = 8 * 1024 * 1024
          private const val MAX_RESOLVED_PER_QUERY = 8
          private const val MAX_GLOBOPLAY_ITEMS_PER_SCAN = 24
          '''
          if text.count(old_repo_constants) != 1:
              raise SystemExit(f"VideoRepository constants expected 1, got {text.count(old_repo_constants)}")
          text = text.replace(old_repo_constants, new_repo_constants, 1)
          p.write_text(text, encoding="utf-8")
          print("patched: VideoRepository browser/full-body requests")

          db = "app/src/main/java/br/com/monitordenoticias/android/VideoDb.kt"
          old_db_match = '''    private fun phraseMatchesStrict(text: String, phrase: String): Boolean {
              val haystack = normalize(text)
              val wanted = normalize(phrase)
              if (wanted.isBlank()) return false
              val hayTokens = haystack.split(' ').filter { it.isNotBlank() }.toSet()
              val wantedTokens = wanted.split(' ').filter { it.isNotBlank() }
              if (wantedTokens.isEmpty()) return false
              if (wantedTokens.size == 1) return wantedTokens.first() in hayTokens
              if (" $haystack ".contains(" $wanted ")) return true
              val meaningful = wantedTokens.filter { it.length >= 3 && it !in STOP_WORDS }
              return meaningful.isNotEmpty() && meaningful.all { it in hayTokens }
          }
          '''
          new_db_match = '''    private fun phraseMatchesStrict(text: String, phrase: String): Boolean {
              val haystack = normalize(text)
              val wanted = normalize(phrase)
              if (wanted.isBlank()) return false
              val hayTokens = haystack.split(' ').filter { it.isNotBlank() }.toSet()
              val wantedTokens = wanted.split(' ').filter { it.isNotBlank() }
              if (wantedTokens.isEmpty()) return false
              if (wantedTokens.size == 1) return hayTokens.any { tokenEquivalent(it, wantedTokens.first()) }
              if (" $haystack ".contains(" $wanted ")) return true
              val meaningful = wantedTokens.filter { it.length >= 3 && it !in STOP_WORDS }
              return meaningful.isNotEmpty() && meaningful.all { wantedToken ->
                  hayTokens.any { actualToken -> tokenEquivalent(actualToken, wantedToken) }
              }
          }

          private fun tokenEquivalent(actual: String, wanted: String): Boolean {
              if (actual == wanted) return true
              if (actual.length < 5 || wanted.length < 5) return false
              return actual in inflectionVariants(wanted) || wanted in inflectionVariants(actual)
          }

          private fun inflectionVariants(token: String): Set<String> = buildSet {
              add(token)
              when {
                  token.endsWith("r") -> add(token + "es")
                  token.endsWith("l") -> add(token.dropLast(1) + "is")
                  token.endsWith("m") -> add(token.dropLast(1) + "ns")
                  token.endsWith("ao") -> {
                      add(token.dropLast(2) + "oes")
                      add(token.dropLast(2) + "aes")
                      add(token.dropLast(2) + "aos")
                  }
                  !token.endsWith("s") -> add(token + "s")
              }
              when {
                  token.endsWith("res") && token.length > 5 -> add(token.dropLast(2))
                  token.endsWith("is") && token.length > 5 -> add(token.dropLast(2) + "l")
                  token.endsWith("ns") && token.length > 5 -> add(token.dropLast(2) + "m")
                  token.endsWith("s") && token.length > 5 -> add(token.dropLast(1))
              }
          }
          '''
          replace_once(db, old_db_match, new_db_match, "DB repair uses same inflection rules")

          ui = "app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt"
          old_ui = '''                        FilledIconButton(onClick = vm::searchNow, enabled = !s.busy, modifier = Modifier.size(44.dp)) {
                              Icon(if (s.busy) Icons.Outlined.HourglassTop else Icons.Outlined.Refresh, "Buscar vídeos")
                          }
                      }
                      if (s.searchProgress.startedAt > 0L) {
          '''
          new_ui = '''                        FilledIconButton(onClick = vm::searchNow, enabled = !s.busy, modifier = Modifier.size(44.dp)) {
                              Icon(if (s.busy) Icons.Outlined.HourglassTop else Icons.Outlined.Refresh, "Buscar vídeos")
                          }
                      }
                      Spacer(Modifier.height(10.dp))
                      OutlinedButton(
                          onClick = { confirmClear = true },
                          enabled = !s.busy && s.totalStored > 0,
                          modifier = Modifier.fillMaxWidth().height(42.dp),
                          border = BorderStroke(1.dp, V30Red.copy(alpha = .38f)),
                          colors = ButtonDefaults.outlinedButtonColors(contentColor = V30Red)
                      ) {
                          Icon(Icons.Outlined.DeleteSweep, null, modifier = Modifier.size(18.dp))
                          Spacer(Modifier.width(7.dp))
                          Text("Limpar vídeos")
                      }
                      if (s.searchProgress.startedAt > 0L) {
          '''
          replace_once(ui, old_ui, new_ui, "visible clear videos button")
          replace_once(
              ui,
              '''                V30Chip("Período", showPeriod) { showPeriod = !showPeriod }
                  V30Chip("Limpar", false) { confirmClear = true }
          ''',
              '''                V30Chip("Período", showPeriod) { showPeriod = !showPeriod }
          ''',
              "remove hidden clear chip"
          )

          gradle = "app/build.gradle.kts"
          replace_once(gradle, '        versionCode = 303\n        versionName = "3.0.3"', '        versionCode = 304\n        versionName = "3.0.4"', "bump app to 3.0.4")

          release = ".github/workflows/release.yml"
          p = Path(release)
          text = p.read_text(encoding="utf-8")
          text = text.replace("v3.0.3", "v3.0.4")
          text = text.replace("versionCode 303 / versionName 3.0.4", "versionCode 304 / versionName 3.0.4")
          text = text.replace("Globoplay Trechos mais robusto e sincronização das notícias automáticas.", "Globoplay com rotas estáveis, flexões seguras de Termos e botão Limpar vídeos.")
          marker = '''            Globoplay / telejornais:
          '''
          if marker not in text:
              raise SystemExit("release body marker not found")
          text = text.replace(marker, '''            Globoplay / telejornais:
              - rotas estáveis conhecidas de Jornal Nacional, Jornal Hoje, Hora 1, Bom Dia Brasil, Jornal da Globo, RJ1/RJ2, SP1/SP2, Bom Dia ES e Jornal Tapajós entram antes da busca dinâmica;
              - landings históricas /v/<id> passam a servir como sementes de descoberta da página real do telejornal, sem virar resultados recorrentes;
              - requisições usam perfil de navegador e aceitam HTML maior para não truncar JSON/JavaScript com cards de Trechos;
              - o cruzamento local aceita flexões nominais conservadoras como militar/militares e naval/navais, mantendo tokens curtos como FAB estritamente exatos;
          ''', 1)
          marker2 = '''            Monitor de Vídeos e agenda:
          '''
          text = text.replace(marker2, '''            Monitor de Vídeos e agenda:
              - botão Limpar vídeos fica visível no card principal, com confirmação antes de apagar apenas o histórico de vídeos;
          ''', 1)
          text = text.replace("instalação direta sobre v3.0.2", "instalação direta sobre v3.0.3")
          p.write_text(text, encoding="utf-8")
          print("patched: v3.0.4 release workflow")
          PY

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 304' app/build.gradle.kts
          grep -q 'versionName = "3.0.4"' app/build.gradle.kts
          grep -q 'globoplay-rj1.*hcSthQ56JW' app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt
          grep -q 'tokenEquivalent' app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          grep -q 'Text("Limpar vídeos")' app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt
          grep -q 'tag_name: v3.0.4' .github/workflows/release.yml
          ! grep -q 'V30Chip("Limpar"' app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt

      - name: Commit app changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RODRIGODESS"
          git config user.email "diguinhodess@gmail.com"
          git add app/build.gradle.kts .github/workflows/release.yml app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt app/src/main/java/br/com/monitordenoticias/android/VideoDb.kt app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt
          git commit -m "fix: encontrar Globoplay e expor limpar vídeos"
          git push origin HEAD:fix/v3.0.4-globoplay-clear