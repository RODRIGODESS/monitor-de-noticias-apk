name: Apply v3.0.4 app patch

on:
  push:
    branches: ["fix/v3.0.4-globoplay-clear"]
    paths: [".github/workflows/temp-v304-app-patch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v3.0.4-globoplay-clear
          fetch-depth: 0

      - name: Reuse guarded patch logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          y = Path('.github/workflows/temp-v304-patch.yml').read_text(encoding='utf-8')
          start = "          from pathlib import Path\n"
          end = "          PY\n          python3 /tmp/patch_v304.py"
          if start not in y or end not in y:
              raise SystemExit('Could not extract guarded patch body')
          body = "from pathlib import Path\n" + y.split(start, 1)[1].split(end, 1)[0]
          lines = body.splitlines()
          normalized = [lines[0]] + [line[10:] if line.startswith('          ') else line for line in lines[1:]]
          Path('/tmp/patch_v304.py').write_text('\n'.join(normalized) + '\n', encoding='utf-8')
          PY
          python3 /tmp/patch_v304.py

      - name: Validate app patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 304' app/build.gradle.kts
          grep -q 'versionName = "3.0.4"' app/build.gradle.kts
          grep -q 'globoplay-rj1.*hcSthQ56JW' app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt
          grep -q 'tokenEquivalent' app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          grep -q 'tokenEquivalent' app/src/main/java/br/com/monitordenoticias/android/VideoDb.kt
          grep -q 'Text("Limpar vídeos")' app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt
          ! grep -q 'V30Chip("Limpar"' app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt

      - name: Commit app files only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/release.yml
          git config user.name "RODRIGODESS"
          git config user.email "diguinhodess@gmail.com"
          git add app/build.gradle.kts app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt app/src/main/java/br/com/monitordenoticias/android/VideoDb.kt app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt
          git commit -m "fix: encontrar Globoplay e expor limpar vídeos"
          git push origin HEAD:fix/v3.0.4-globoplay-clear