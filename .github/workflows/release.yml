name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Validate code on pull request
        if: github.event_name == 'pull_request'
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: permanent Android signing secrets are missing."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/monitor-noticias-release.jks
          test -s signing/monitor-noticias-release.jks

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/monitor-noticias-release.jks
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleRelease

      - name: Verify permanent signing certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          FINAL="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="signing/monitor-noticias-release.jks"
          EXPECTED_CERT="07164d3faf3ee09f241a547d403767c454b226faac26c4b058bc5011d773b1b0"

          "$APKSIGNER" verify --verbose "$FINAL"
          final_output=$("$APKSIGNER" verify --verbose --print-certs "$FINAL" 2>&1)
          printf '%s\n' "$final_output"

          extract_cert() {
            local output="$1"
            local line
            line=$(printf '%s\n' "$output" | grep -iE 'certificate.*sha-?256.*digest|sha-?256.*certificate.*digest' | head -1 || true)
            if [ -z "$line" ]; then
              line=$(printf '%s\n' "$output" | grep -iE 'sha-?256.*digest' | head -1 || true)
            fi
            printf '%s\n' "$line" | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ':[:space:]\r' | tr 'A-F' 'a-f'
          }

          FINAL_CERT=$(extract_cert "$final_output")
          KEYSTORE_CERT=$(keytool -list -v -keystore "$KEYSTORE" -alias monitor-noticias -storepass "$ANDROID_SIGNING_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":","",$2); gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')

          echo "Release certificate:  $FINAL_CERT"
          echo "Keystore certificate: $KEYSTORE_CERT"
          test -n "$FINAL_CERT"
          test -n "$KEYSTORE_CERT"
          test "$KEYSTORE_CERT" = "$EXPECTED_CERT"
          test "$FINAL_CERT" = "$EXPECTED_CERT"
          echo "PERMANENT_SIGNING_OK=true"

      - name: Prepare v2.8.5 release asset
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk monitor-de-noticias-v2.8.5.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.5
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v2.8.5
          body: |
            Versão 2.8.5 do Monitor de Notícias Android.

            Monitor de Vídeos — precisão e controle:
            - termos passam a casar por palavra inteira, evitando falso positivo como "FAB" dentro de "fábrica";
            - resultados antigos com esse tipo de associação incorreta são corrigidos/limpos automaticamente;
            - nova opção "Limpar" na tela de vídeos, com confirmação antes de apagar o histórico;
            - nova pesquisa de vídeos por período com presets Hoje, 24 horas, 7 dias e 30 dias, além de data/hora manual;
            - a pesquisa por período cruza os vídeos com os mesmos Termos e Demandas do monitor.

            Globoplay — telejornais regionais:
            - mantém os telejornais nacionais e regionais já cadastrados;
            - cada telejornal específico passa a pesquisar "nome do programa + Termo/Demanda" no Globoplay;
            - adiciona varreduras amplas para todos os "Bom Dia" regionais;
            - adiciona varreduras amplas para todas as 1ª Edições regionais;
            - adiciona varreduras amplas para todas as 2ª Edições regionais;
            - as novas varreduras regionais são habilitadas automaticamente uma única vez na atualização.

            Fontes existentes:
            - mantém Globoplay geral, R7/Record, CNN, SBT, Band, fontes regionais e canais oficiais do YouTube;
            - resultados continuam exigindo link direto de vídeo e passam pela deduplicação existente;
            - busca automática de vídeos permanece aproximadamente a cada 1 hora.

            Atualização:
            - versionCode 285 / versionName 2.8.5;
            - mesmo applicationId e mesma assinatura permanente da linha v2.5+;
            - instalação direta sobre v2.8.4 preservando dados e configurações.
          files: monitor-de-noticias-v2.8.5.apk
          make_latest: true
