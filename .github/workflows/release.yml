name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Validate code on pull request
        if: github.event_name == 'pull_request'
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: permanent Android signing secrets are missing."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/monitor-noticias-release.jks
          test -s signing/monitor-noticias-release.jks

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/monitor-noticias-release.jks
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleRelease

      - name: Verify permanent signing certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          FINAL="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="signing/monitor-noticias-release.jks"
          EXPECTED_CERT="07164d3faf3ee09f241a547d403767c454b226faac26c4b058bc5011d773b1b0"

          "$APKSIGNER" verify --verbose "$FINAL"
          final_output=$("$APKSIGNER" verify --verbose --print-certs "$FINAL" 2>&1)
          printf '%s\n' "$final_output"

          extract_cert() {
            local output="$1"
            local line
            line=$(printf '%s\n' "$output" | grep -iE 'certificate.*sha-?256.*digest|sha-?256.*certificate.*digest' | head -1 || true)
            if [ -z "$line" ]; then
              line=$(printf '%s\n' "$output" | grep -iE 'sha-?256.*digest' | head -1 || true)
            fi
            printf '%s\n' "$line" | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ':[:space:]\r' | tr 'A-F' 'a-f'
          }

          FINAL_CERT=$(extract_cert "$final_output")
          KEYSTORE_CERT=$(keytool -list -v -keystore "$KEYSTORE" -alias monitor-noticias -storepass "$ANDROID_SIGNING_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":","",$2); gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')

          echo "Release certificate:  $FINAL_CERT"
          echo "Keystore certificate: $KEYSTORE_CERT"
          test -n "$FINAL_CERT"
          test -n "$KEYSTORE_CERT"
          test "$KEYSTORE_CERT" = "$EXPECTED_CERT"
          test "$FINAL_CERT" = "$EXPECTED_CERT"
          echo "PERMANENT_SIGNING_OK=true"

      - name: Prepare v3.0.9 release asset
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk monitor-de-noticias-v3.0.9.apk

      - name: Point v3.0.9 tag to validated main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v3.0.9 "$GITHUB_SHA"
          git push --force origin refs/tags/v3.0.9

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.9
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v3.0.9
          body: |
            Monitor de Notícias Android v3.0.9 — descoberta dinâmica do Globoplay, diagnóstico de fontes e ajustes de layout.

            Globoplay nacionais:
            - Bom Dia Brasil, Hora 1, Jornal Hoje, Jornal Nacional e Jornal da Globo combinam Edições, Trechos e o backend Jarvis do próprio Globoplay;
            - a camada Jarvis contorna páginas /cenas/ cujo conteúdo recente só aparece depois que o JavaScript do site é executado;
            - Termos e Demandas são consultados globalmente no Jarvis e depois cruzados localmente por telejornal, evitando voltar ao modelo fonte x termo;
            - vídeos descobertos pelo Jarvis são enriquecidos na página direta /v/<id> antes de serem aceitos na janela de tempo;
            - o fluxo foi validado com o Jornal Hoje “Veja os desfiles de 7 de setembro pelo país” e com o Jornal Nacional “Comemorações do 7 de setembro reúnem milhares de pessoas em diferentes regiões”.

            7 de Setembro:
            - consultas ao Jarvis usam variantes mais estáveis sem preposições que causavam timeout no backend;
            - o matcher reconhece, dentro do mesmo evento, variações controladas como desfile, desfiles, comemoração, comemorações e independência;
            - a tag “desfiles 7 de setembro” pode encontrar títulos equivalentes sem liberar correspondências genéricas fora desse contexto.

            Fontes instáveis:
            - o resultado passa a guardar o nome da fonte instável, quantidade de falhas e a etapa principal da falha;
            - a tela de Vídeos oferece “Ver fontes instáveis” para abrir o diagnóstico;
            - caminhos auxiliares que falham mas conseguem fallback não devem inflar o total de fontes instáveis.

            Layout:
            - Abrir notícia e WhatsApp passam a usar a mesma altura e distribuição de largura nos cards de Notícias;
            - o ajuste também alcança as telas de histórico/período/demandas que reutilizam os cards.

            Mantido:
            - YouTube e regionais continuam usando os caminhos que já funcionaram na v3.0.8;
            - resultados progressivos, cronômetro, progresso e Limpar vídeos;
            - janela móvel das últimas 24 horas para buscas normais e automáticas de vídeo;
            - agenda automática aproximadamente às 08h, 12h, 15h, 19h e 21h.

            Atualização:
            - versionCode 309 / versionName 3.0.9;
            - mesmo applicationId br.com.monitordenoticias.android;
            - mesma assinatura permanente;
            - instalação direta sobre v3.0.8 preservando Termos, Demandas, histórico e configurações.
          files: monitor-de-noticias-v3.0.9.apk
          overwrite_files: true
          make_latest: true
