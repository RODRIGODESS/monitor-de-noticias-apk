name: Windows Portable v4.0.2

on:
  workflow_dispatch:
  push:
    branches:
      - "windows/**"
      - "codex/windows/**"
    paths:
      - "desktop/**"
      - "app/src/main/java/br/com/monitordenoticias/android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/windows-portable.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "app/src/main/java/br/com/monitordenoticias/android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/windows-portable.yml"

permissions:
  contents: write

concurrency:
  group: windows-portable-v4.0.2-${{ github.ref }}
  cancel-in-progress: true

# O próprio runner instala o Gradle porque o projeto Android original não possui wrapper versionado.
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare native Windows icon
        shell: pwsh
        run: |
          $encoded = "desktop\src\main\resources\monitor_icon.ico.b64"
          $icon = "desktop\src\main\resources\monitor_icon.ico"
          if (!(Test-Path $encoded)) { throw "Native icon source was not found: $encoded" }
          $base64 = [IO.File]::ReadAllText($encoded).Trim()
          [IO.File]::WriteAllBytes($icon, [Convert]::FromBase64String($base64))
          if (!(Test-Path $icon)) { throw "Native icon was not generated." }
          $length = (Get-Item $icon).Length
          if ($length -lt 1000) { throw "Generated ICO is unexpectedly small: $length bytes" }
          Write-Host "Native Windows icon ready: $icon ($length bytes)"

      - name: Build Windows app image
        shell: pwsh
        run: gradle :desktop:createDistributable --stacktrace

      - name: Validate bundled JVM
        shell: pwsh
        run: |
          $root = "desktop\build\compose\binaries\main\app"
          if (!(Test-Path $root)) { throw "Compose app image was not generated: $root" }
          $appDir = Get-ChildItem $root -Directory | Select-Object -First 1
          if ($null -eq $appDir) { throw "Portable application directory not found." }
          $runtimeBin = Join-Path $appDir.FullName "runtime\bin"
          if (!(Test-Path $runtimeBin)) { throw "Bundled JVM runtime/bin not found: $runtimeBin" }

          $nativeDlls = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          foreach ($dll in $nativeDlls) {
            $source = Join-Path $env:JAVA_HOME "bin\$dll"
            $target = Join-Path $runtimeBin $dll
            if (!(Test-Path $target)) {
              if (!(Test-Path $source)) { throw "Required native dependency not found: $dll" }
              Copy-Item $source $target -Force
              Write-Host "Added native dependency missing from reduced runtime: $dll"
            } else {
              Write-Host "Native dependency already bundled: $dll"
            }
          }

          $jvm = Join-Path $runtimeBin "server\jvm.dll"
          if (!(Test-Path $jvm)) { throw "jvm.dll not found: $jvm" }
          $env:PATH = "$runtimeBin;$runtimeBin\server;$env:PATH"
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeLibraryCheck {
              [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Unicode)]
              public static extern IntPtr LoadLibrary(string lpFileName);
              [DllImport("kernel32", SetLastError=true)]
              public static extern bool FreeLibrary(IntPtr hModule);
          }
          '@
          $handle = [NativeLibraryCheck]::LoadLibrary($jvm)
          if ($handle -eq [IntPtr]::Zero) {
            $code = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
            throw "Windows could not load bundled jvm.dll. Win32 error: $code"
          }
          [NativeLibraryCheck]::FreeLibrary($handle) | Out-Null
          Write-Host "Bundled jvm.dll loaded successfully."

      - name: Smoke test exact packaged launcher and app initialization
        shell: pwsh
        run: |
          $root = "desktop\build\compose\binaries\main\app"
          $appDir = Get-ChildItem $root -Directory | Select-Object -First 1
          $exe = Get-ChildItem $appDir.FullName -Filter *.exe -File | Select-Object -First 1
          if ($null -eq $exe) { throw "Windows executable not found in app image root." }
          $cfg = Get-ChildItem (Join-Path $appDir.FullName "app") -Filter *.cfg -File | Select-Object -First 1
          if ($null -eq $cfg) { throw "jpackage launcher cfg not found." }

          $originalCfg = [IO.File]::ReadAllText($cfg.FullName)
          if ($originalCfg -notmatch '(?m)^app\.mainclass=') {
            throw "app.mainclass was not found in $($cfg.FullName)"
          }
          $selfTestCfg = [regex]::Replace(
            $originalCfg,
            '(?m)^app\.mainclass=.*$',
            'app.mainclass=br.com.monitordenoticias.desktop.SelfTestKt'
          )

          try {
            [IO.File]::WriteAllText($cfg.FullName, $selfTestCfg, [Text.UTF8Encoding]::new($false))
            Write-Host "Launching exact packaged EXE with CI self-test main class."
            $process = Start-Process -FilePath $exe.FullName -WorkingDirectory $appDir.FullName -PassThru
            if (!$process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Packaged EXE self-test did not exit within 30 seconds (possible JVM/startup error dialog)."
            }
            if ($process.ExitCode -ne 0) {
              throw "Packaged EXE self-test failed with exit code $($process.ExitCode)."
            }
            Write-Host "Packaged EXE self-test passed with exit code 0."
          } finally {
            [IO.File]::WriteAllText($cfg.FullName, $originalCfg, [Text.UTF8Encoding]::new($false))
          }

          $restored = [IO.File]::ReadAllText($cfg.FullName)
          if ($restored -notmatch '(?m)^app\.mainclass=br\.com\.monitordenoticias\.desktop\.MainKt\s*$') {
            throw "Production main class was not restored after self-test."
          }
          Write-Host "Production launcher configuration restored."

      - name: Verify and create portable ZIP
        shell: pwsh
        run: |
          $root = "desktop\build\compose\binaries\main\app"
          if (!(Test-Path $root)) { throw "Compose app image was not generated: $root" }
          $appDir = Get-ChildItem $root -Directory | Select-Object -First 1
          if ($null -eq $appDir) { throw "Portable application directory not found." }
          $exe = Get-ChildItem $appDir.FullName -Filter *.exe -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw "Windows executable not found in app image." }
          New-Item -ItemType Directory -Force -Path "$($appDir.FullName)\data" | Out-Null
          $zip = "$PWD\monitor-de-noticias-windows-portable-v4.0.2.zip"
          Compress-Archive -Path "$($appDir.FullName)\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  monitor-de-noticias-windows-portable-v4.0.2.zip" | Set-Content "$PWD\monitor-de-noticias-windows-portable-v4.0.2.sha256" -Encoding ascii
          Get-Item $zip | Format-List FullName,Length
          Write-Host "SHA256: $hash"

      - name: Publish portable ZIP in Windows prerelease
        if: github.ref == 'refs/heads/codex/windows/v4.0.2-portable'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-v4.0.2-portable"
          $asset = "monitor-de-noticias-windows-portable-v4.0.2.zip"
          $checksum = "monitor-de-noticias-windows-portable-v4.0.2.sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset $checksum --target "${{ github.sha }}" --title "Monitor de Notícias v4.0.2 — Windows Portable" --notes "Build Windows portable da v4.0.2. Mantém o motor de Notícias/Vídeos da versão Android e adapta somente as camadas específicas da plataforma para Windows." --prerelease
          } else {
            gh release upload $tag $asset $checksum --clobber
            $releaseId = gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.id'
            gh api --method PATCH "repos/${{ github.repository }}/releases/$releaseId" -f target_commitish="${{ github.sha }}" *> $null
          }
