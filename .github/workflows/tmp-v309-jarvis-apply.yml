name: TEMP Apply v3.0.9 Jarvis

on:
  push:
    branches:
      - fix/v3.0.9-national-globoplay-diagnostics-layout

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[jarvis-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.9-national-globoplay-diagnostics-layout
      - name: Wire Jarvis into repository
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt')
          text = path.read_text()

          old = '''    private val globoplayTrechosCollector = GloboplayTrechosCollector()\n    private val globoplayEditionCollector = GloboplayEditionCollector()\n'''
          new = '''    private val globoplayTrechosCollector = GloboplayTrechosCollector()\n    private val globoplayEditionCollector = GloboplayEditionCollector()\n    private val globoplayJarvisCollector = GloboplayJarvisCollector()\n'''
          if old not in text:
              raise SystemExit('collector anchor not found')
          text = text.replace(old, new, 1)

          old = '''            onUpdate?.invoke(VideoSearchUpdate(progress("Preparando", "")))\n\n            plan.forEach { (source, specs) ->\n'''
          new = '''            onUpdate?.invoke(VideoSearchUpdate(progress("Preparando", "")))\n\n            // JH/JN e alguns nacionais recebem os Trechos recentes apenas depois que\n            // o JavaScript do Globoplay roda. Fazemos uma busca Jarvis GLOBAL por\n            // Termo/Demanda (nunca fonte x termo) e depois distribuímos localmente\n            // os vídeos pelo nome/originProgramId do telejornal.\n            val nationalGloboplaySources = sources.filter { it.id in CORE_NATIONAL_GLOBOPLAY_IDS }\n            val jarvisQueries = buildList {\n                addAll(terms)\n                demands\n                    .filter { demand -> nationalGloboplaySources.any { source -> sourceMatchesDemand(source, demand.vehicle) } }\n                    .forEach { demand -> add(demand.subject) }\n            }.map { it.trim() }\n                .filter { it.isNotBlank() }\n                .distinctBy(::normalize)\n\n            val jarvisOutcome = if (nationalGloboplaySources.isNotEmpty() && jarvisQueries.isNotEmpty()) {\n                onUpdate?.invoke(\n                    VideoSearchUpdate(progress("Globoplay nacionais", "Jarvis • busca global de Termos/Demandas"))\n                )\n                runCatching {\n                    globoplayJarvisCollector.collect(jarvisQueries, nationalGloboplaySources, capturedAt)\n                }.getOrElse {\n                    GloboplayJarvisCollector.Outcome(emptyMap(), failedQueries = jarvisQueries.size)\n                }\n            } else {\n                GloboplayJarvisCollector.Outcome(emptyMap(), failedQueries = 0)\n            }\n\n            plan.forEach { (source, specs) ->\n'''
          if old not in text:
              raise SystemExit('pre-plan anchor not found')
          text = text.replace(old, new, 1)

          old = '''                val sourceScanCandidates = if (isSourceScanMode(source)) {\n                    collectRecentBySource(source, capturedAt, effectiveFrom, effectiveTo) { stage -> sourceError(stage) }\n                } else {\n                    emptyList()\n                }\n'''
          new = '''                val sourceScanCandidates = if (isSourceScanMode(source)) {\n                    val nativeCandidates = collectRecentBySource(\n                        source,\n                        capturedAt,\n                        effectiveFrom,\n                        effectiveTo\n                    ) { stage -> sourceError(stage) }\n                    if (source.id in CORE_NATIONAL_GLOBOPLAY_IDS) {\n                        (jarvisOutcome.candidatesBySourceId[source.id].orEmpty() + nativeCandidates)\n                            .distinctBy { canonicalKey(it.link) }\n                    } else {\n                        nativeCandidates\n                    }\n                } else {\n                    emptyList()\n                }\n'''
          if old not in text:
              raise SystemExit('source candidates anchor not found')
          text = text.replace(old, new, 1)

          old = '''                    val progressQuery = if (scanMode) "Vídeos recentes • cruzamento local" else spec.query\n'''
          new = '''                    val progressQuery = when {\n                        !scanMode -> spec.query\n                        source.id in CORE_NATIONAL_GLOBOPLAY_IDS -> "Edições + Trechos + Jarvis • cruzamento local"\n                        else -> "Vídeos recentes • cruzamento local"\n                    }\n'''
          if old not in text:
              raise SystemExit('progress anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit repository integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          git commit -m "feat: integrate Jarvis global discovery for national Globoplay [jarvis-applied]"
          git push origin HEAD:fix/v3.0.9-national-globoplay-diagnostics-layout
