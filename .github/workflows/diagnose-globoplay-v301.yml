name: Diagnose Globoplay v3.0.1

on:
  push:
    branches: ["fix/v3.0.1-video-scan-and-demand-alerts"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test G1 program pagination
        run: |
          set -u
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'
          base='https://g1.globo.com/ma/maranhao/videos-bom-dia-mirante/'
          for suffix in '' '?page=2' '?pagina=2' 'index/page/2/'; do
            url="${base}${suffix}"
            echo "=== $url ==="
            code=$(curl -L --max-time 20 -A "$UA" -o /tmp/p.html -sS -w '%{http_code}' "$url" || true)
            echo "HTTP=$code bytes=$(wc -c < /tmp/p.html 2>/dev/null || echo 0)"
            if grep -q '14937180' /tmp/p.html; then echo 'TARGET=yes'; else echo 'TARGET=no'; fi
            grep -Eio '(href="[^"]*(page|pagina)[^"]*"|https?[^" ]+/edicao/2026/09/[^" ]+)' /tmp/p.html | head -20 || true
          done
