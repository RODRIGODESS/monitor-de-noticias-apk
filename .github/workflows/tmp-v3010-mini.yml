name: TEMP v3010 mini patch

on:
  push:
    branches:
      - fix/v3.0.10-jarvis-dates-source-health

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.10-jarvis-dates-source-health
      - name: Apply source-health fix
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/br/com/monitordenoticias/android/GloboplayEditionCollector.kt"); s=p.read_text(); old="""    private fun fetchDocumentOrNull(url: String, onError: () -> Unit): Document? =\n        runCatching { fetchDocument(url) }\n            .onFailure { onError() }\n            .getOrNull()\n"""; new="""    private fun fetchDocumentOrNull(url: String, onError: () -> Unit): Document? =\n        runCatching { fetchDocument(url) }.getOrNull()\n"""; assert old in s; p.write_text(s.replace(old,new,1))'
          rm -f .github/workflows/tmp-v3010-mini.yml
          rm -f .github/workflows/tmp-v3010-repository-patch.yml
          rm -f .github/workflows/tmp-v3010-apply-core.yml
          rm -f .github/workflows/tmp-v3010-jarvis-date-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: count only actionable Globoplay source instability"
          git push origin HEAD:fix/v3.0.10-jarvis-dates-source-health
