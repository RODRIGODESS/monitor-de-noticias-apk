name: Apply v3.0.1 patches

on:
  push:
    branches: ["fix/v3.0.1-video-scan-and-demand-alerts"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.1-video-scan-and-demand-alerts
          fetch-depth: 0
      - name: Apply integration patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              changed = False
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new)
                      changed = True
                  elif new not in text:
                      raise SystemExit(f'Expected snippet not found in {path}: {old[:100]}')
              if changed:
                  p.write_text(text)

          patch('app/src/main/java/br/com/monitordenoticias/android/VideoViewModel.kt', [
              ('private val repo = VideoRepository(app, db)', 'private val repo = VideoRepositoryV301(app, db)'),
          ])
          patch('app/src/main/java/br/com/monitordenoticias/android/VideoMonitorWorker.kt', [
              ('VideoRepository(applicationContext, db).search(sources)', 'VideoRepositoryV301(applicationContext, db).search(sources)'),
          ])
          patch('app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt', [
              ('val videoDemands = videos.items.count { it.demand }', 'val videoDemands = videos.items.count { it.demand }\n    val matchedDemands = news.demands.count { it.lastFoundCount > 0 }'),
              ('V30Metric("Demandas", news.demands.size.toString(), Icons.Outlined.NotificationsActive, V30Amber, Modifier.weight(1f))', 'V30Metric("Demandas", matchedDemands.toString(), Icons.Outlined.NotificationsActive, if (matchedDemands > 0) V30Amber else V30Text2, Modifier.weight(1f))'),
              ('Text("Os cards entram nesta tela assim que cada vídeo é validado, sem esperar o fim da varredura.", color = V30Text2, fontSize = 10.5.sp)', 'Text("Os cards entram nesta tela assim que cada vídeo é validado, sem esperar o fim da varredura.", color = V30Text2, fontSize = 10.5.sp)\n                        Text("Automática: 08h • 12h • 15h • 19h • 21h • busca manual sempre disponível", color = V30Purple, fontSize = 10.5.sp, fontWeight = FontWeight.SemiBold)'),
          ])
          patch('app/src/main/java/br/com/monitordenoticias/android/MainActivityV28.kt', [
              ('Vídeos e demandas permanecem em aproximadamente 1 hora', 'Vídeos: 08h, 12h, 15h, 19h e 21h • Demandas: aproximadamente 1 hora'),
          ])
          patch('app/build.gradle.kts', [
              ('versionCode = 300', 'versionCode = 301'),
              ('versionName = "3.0.0"', 'versionName = "3.0.1"'),
          ])
          PY
      - name: Commit patches
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "fix: integrate v3.0.1 video scan and demand alerts"
          git push origin HEAD:fix/v3.0.1-video-scan-and-demand-alerts
