name: Apply professional Windows UI and terms

on:
  push:
    branches:
      - codex/windows/v4.0.2-portable
    paths:
      - .github/workflows/professional-ui-terms-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/windows/v4.0.2-portable

      - name: Apply established terms and professional UI
        run: python .github/scripts/professional_ui_terms_patch.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/main/kotlin/br/com/monitordenoticias/android/DesktopNewsDb.kt \
                  desktop/src/main/kotlin/br/com/monitordenoticias/desktop/DesktopController.kt \
                  desktop/src/main/kotlin/br/com/monitordenoticias/desktop/Main.kt
          git diff --cached --quiet && exit 0
          git commit -m "feat(windows): termos estabelecidos e layout profissional"
          git push origin HEAD:codex/windows/v4.0.2-portable
