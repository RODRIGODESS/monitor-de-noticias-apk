name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Validate code on pull request
        if: github.event_name == 'pull_request'
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD in repository Actions secrets."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/monitor-noticias-release.jks
          test -s signing/monitor-noticias-release.jks

      - name: Build permanently signed migration and release APKs
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/monitor-noticias-release.jks
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Verify permanent signing certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          MIGRATION="app/build/outputs/apk/debug/app-debug.apk"
          FINAL="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="signing/monitor-noticias-release.jks"
          EXPECTED_CERT="07164d3faf3ee09f241a547d403767c454b226faac26c4b058bc5011d773b1b0"

          "$APKSIGNER" verify --verbose "$MIGRATION"
          "$APKSIGNER" verify --verbose "$FINAL"

          migration_output=$("$APKSIGNER" verify --verbose --print-certs "$MIGRATION" 2>&1)
          final_output=$("$APKSIGNER" verify --verbose --print-certs "$FINAL" 2>&1)
          printf '%s\n' "$migration_output"
          printf '%s\n' "$final_output"

          extract_cert() {
            local output="$1"
            local line
            line=$(printf '%s\n' "$output" | grep -iE 'certificate.*sha-?256.*digest|sha-?256.*certificate.*digest' | head -1 || true)
            if [ -z "$line" ]; then
              line=$(printf '%s\n' "$output" | grep -iE 'sha-?256.*digest' | head -1 || true)
            fi
            printf '%s\n' "$line" | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ':[:space:]\r' | tr 'A-F' 'a-f'
          }

          MIGRATION_CERT=$(extract_cert "$migration_output")
          FINAL_CERT=$(extract_cert "$final_output")
          KEYSTORE_CERT=$(keytool -list -v -keystore "$KEYSTORE" -alias monitor-noticias -storepass "$ANDROID_SIGNING_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":","",$2); gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')

          echo "Migration certificate: $MIGRATION_CERT"
          echo "Release certificate:   $FINAL_CERT"
          echo "Keystore certificate:  $KEYSTORE_CERT"

          test -n "$MIGRATION_CERT"
          test -n "$FINAL_CERT"
          test -n "$KEYSTORE_CERT"
          test "$KEYSTORE_CERT" = "$EXPECTED_CERT"
          test "$MIGRATION_CERT" = "$EXPECTED_CERT"
          test "$FINAL_CERT" = "$EXPECTED_CERT"
          test "$MIGRATION_CERT" = "$FINAL_CERT"
          echo "PERMANENT_SIGNING_OK=true"

      - name: Prepare v2.5.0 release assets
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk monitor-de-noticias-v2.5.0-migration.apk
          cp app/build/outputs/apk/release/app-release.apk monitor-de-noticias-v2.5.0.apk
          cp tools/migrate_v24_data.py migrate_v24_data.py

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v2.5.0
          body: |
            Versão 2.5.0 do Monitor de Notícias Android.

            Demandas:
            - pesquisa independente de cada demanda;
            - monitoramento automático aproximadamente a cada 1 hora via WorkManager;
            - botão para pesquisar todas as demandas manualmente;
            - botão de pesquisa individual em cada demanda;
            - registro persistente da última execução, resultados, matérias novas e erros.

            Preservação dos dados da v2.4:
            - a v2.4 foi assinada por uma chave de debug efêmera que não existe mais;
            - NÃO desinstale a v2.4 antes de criar o backup;
            - use migrate_v24_data.py com ADB para fazer a transição única;
            - o APK `-migration` é debuggable e assinado com a nova chave permanente;
            - o APK final usa a mesma chave permanente;
            - depois desta migração, futuras versões poderão atualizar normalmente sem apagar os dados.

            Banco:
            - migração SQLite 2 → 3 sem apagar notícias, termos ou demandas;
            - fontes, período, intervalo e demais SharedPreferences são preservados pelo backup/restauração.
          files: |
            monitor-de-noticias-v2.5.0-migration.apk
            monitor-de-noticias-v2.5.0.apk
            migrate_v24_data.py
          make_latest: true
