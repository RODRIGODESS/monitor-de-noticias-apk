name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Validate code on pull request
        if: github.event_name == 'pull_request'
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: permanent Android signing secrets are missing."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/monitor-noticias-release.jks
          test -s signing/monitor-noticias-release.jks

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/monitor-noticias-release.jks
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleRelease

      - name: Verify permanent signing certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          FINAL="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="signing/monitor-noticias-release.jks"
          EXPECTED_CERT="07164d3faf3ee09f241a547d403767c454b226faac26c4b058bc5011d773b1b0"

          "$APKSIGNER" verify --verbose "$FINAL"
          final_output=$("$APKSIGNER" verify --verbose --print-certs "$FINAL" 2>&1)
          printf '%s\n' "$final_output"

          extract_cert() {
            local output="$1"
            local line
            line=$(printf '%s\n' "$output" | grep -iE 'certificate.*sha-?256.*digest|sha-?256.*certificate.*digest' | head -1 || true)
            if [ -z "$line" ]; then
              line=$(printf '%s\n' "$output" | grep -iE 'sha-?256.*digest' | head -1 || true)
            fi
            printf '%s\n' "$line" | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ':[:space:]\r' | tr 'A-F' 'a-f'
          }

          FINAL_CERT=$(extract_cert "$final_output")
          KEYSTORE_CERT=$(keytool -list -v -keystore "$KEYSTORE" -alias monitor-noticias -storepass "$ANDROID_SIGNING_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":","",$2); gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')

          echo "Release certificate:  $FINAL_CERT"
          echo "Keystore certificate: $KEYSTORE_CERT"
          test -n "$FINAL_CERT"
          test -n "$KEYSTORE_CERT"
          test "$KEYSTORE_CERT" = "$EXPECTED_CERT"
          test "$FINAL_CERT" = "$EXPECTED_CERT"
          echo "PERMANENT_SIGNING_OK=true"

      - name: Prepare v3.0.6 release asset
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk monitor-de-noticias-v3.0.6.apk

      - name: Point v3.0.6 tag to validated main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v3.0.6 "$GITHUB_SHA"
          git push --force origin refs/tags/v3.0.6

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.6
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v3.0.6
          body: |
            Monitor de Notícias Android v3.0.6 — janela móvel de 24h com datas do Globoplay endurecidas.

            Monitor de Vídeos:
            - buscas manuais normais continuam considerando somente as últimas 24 horas;
            - buscas automáticas das 08h, 12h, 15h, 19h e 21h usam a mesma janela móvel de 24 horas;
            - pesquisas de período continuam respeitando exatamente o intervalo escolhido pelo usuário;
            - o status da busca manual continua deixando explícito que a janela padrão é de 24h;
            - botão Limpar vídeos permanece visível e continua apagando somente o histórico de vídeos.

            Globoplay / telejornais:
            - datas sem horário passam a representar um intervalo possível e nunca geram horário futuro;
            - para blocos de hoje, o limite superior da data é o próprio momento da captura, evitando rejeitar vídeo atual por aparecer como 23:59;
            - para dias anteriores, o fim do dia continua sendo usado de forma conservadora quando não existe horário preciso;
            - links encontrados em JSON/JavaScript tentam primeiro timestamps ISO de datePublished, uploadDate, publishedAt e campos equivalentes;
            - quando a página individual /v/<id> fornece timestamp mais preciso, ele continua tendo prioridade;
            - vídeo sem qualquer data verificável deixa de ser promovido artificialmente para o horário da captura;
            - timestamps futuros encontrados em metadados são descartados;
            - rotas estáveis, sementes históricas, flexões seguras de Termos e links diretos permanecem.

            Notícias automáticas:
            - permanece a sincronização da Home e do Histórico com o banco após os workers automáticos.

            Atualização:
            - versionCode 306 / versionName 3.0.6;
            - mesmo applicationId br.com.monitordenoticias.android;
            - mesma assinatura permanente da linha v2.5+;
            - instalação direta sobre v3.0.5 preservando Termos, Demandas, histórico de notícias e configurações.
          files: monitor-de-noticias-v3.0.6.apk
          overwrite_files: true
          make_latest: true
