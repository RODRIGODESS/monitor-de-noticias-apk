name: Wire v2.9 video screen

on:
  push:
    branches: ["feature/v2.9.0-video-sources-by-region"]

permissions:
  contents: write

jobs:
  wire-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2.9.0-video-sources-by-region
          fetch-depth: 0
      - name: Replace video screen entry point
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/br/com/monitordenoticias/android/MainActivityV28.kt')
          text = p.read_text()
          old = 'V28Section.VIDEOS -> V28Videos(videos, videoVm)'
          new = 'V28Section.VIDEOS -> V29Videos(videos, videoVm)'
          if new in text:
              print('Already wired')
          elif old in text:
              p.write_text(text.replace(old, new, 1))
              print('Wired v2.9 video screen')
          else:
              raise SystemExit('Expected video entry point not found')
          PY
      - name: Commit source change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/MainActivityV28.kt
          git commit -m "feat: use v2.9 video sources screen"
          git push origin HEAD:feature/v2.9.0-video-sources-by-region
