name: TEMP Probe JH JN raw HTML

on:
  push:
    branches:
      - fix/v3.0.9-national-globoplay-diagnostics-layout

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Validate global Jarvis term searches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error, concurrent.futures, unicodedata
          endpoint='https://cloud-jarvis.globo.com/graphql'
          headers={'content-type':'application/json','x-platform-id':'web','x-device-id':'desktop','x-client-version':'2024.12-5','user-agent':'Mozilla/5.0'}
          query_doc='''query Probe($q:String!,$page:Int) { search { videos(query:$q,page:$page) { page nextPage total hasNextPage resources { id headline description duration title { headline originProgramId } } } } }'''
          terms=['7 de setembro','desfile 7 de setembro','desfiles 7 de setembro','militar','militares','Forças Armadas']
          def norm(s):
            return ''.join(c for c in unicodedata.normalize('NFD',s or '') if unicodedata.category(c)!='Mn').lower()
          def run(pair):
            q,page=pair
            body={'operationName':'Probe','variables':{'q':q,'page':page},'query':query_doc}
            req=urllib.request.Request(endpoint,data=json.dumps(body).encode(),headers=headers,method='POST')
            try:
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read().decode()
            except urllib.error.HTTPError as e: raw=e.read().decode()
            try:return q,page,json.loads(raw)
            except:return q,page,{'raw':raw[:500]}
          pairs=[(q,1) for q in terms]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
            results=list(ex.map(run,pairs))
          for q,page,d in results:
            print('===',q,'===')
            if d.get('errors'):
              print('ERRORS=',d['errors']); continue
            c=d['data']['search']['videos']
            print('TOTAL=',c.get('total'),'NEXT=',c.get('nextPage'),'COUNT=',len(c.get('resources') or []))
            for v in c.get('resources') or []:
              title=(v.get('title') or {}).get('headline','')
              h=v.get('headline','')
              desc=v.get('description','')
              interesting=(title in ['Jornal Hoje','Jornal Nacional'] or v.get('id')=='14940098' or '7 de setembro' in norm(h+' '+desc))
              if interesting:
                print('MATCH=',json.dumps(v,ensure_ascii=False))
          PY
