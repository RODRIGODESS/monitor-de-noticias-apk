name: Temp v3.0.11 patch

on:
  push:
    branches:
      - feat/v3.0.11-programas-band-record-globoplay

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/v3.0.11-programas-band-record-globoplay
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/temp-v3011-patch.py

      - name: Commit patched app files
        shell: bash
        run: |
          git restore .github/workflows/release.yml
          if git diff --quiet -- app; then
            echo "No app changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "feat: ampliar programas de vídeo e estabilizar fontes na v3.0.11 [skip ci]"
          git push origin HEAD:feat/v3.0.11-programas-band-record-globoplay
