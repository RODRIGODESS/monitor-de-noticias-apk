name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Validate code on pull request
        if: github.event_name == 'pull_request'
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: permanent Android signing secrets are missing."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/monitor-noticias-release.jks
          test -s signing/monitor-noticias-release.jks

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/monitor-noticias-release.jks
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleRelease

      - name: Verify permanent signing certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          FINAL="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="signing/monitor-noticias-release.jks"
          EXPECTED_CERT="07164d3faf3ee09f241a547d403767c454b226faac26c4b058bc5011d773b1b0"

          "$APKSIGNER" verify --verbose "$FINAL"
          final_output=$("$APKSIGNER" verify --verbose --print-certs "$FINAL" 2>&1)
          printf '%s\n' "$final_output"

          extract_cert() {
            local output="$1"
            local line
            line=$(printf '%s\n' "$output" | grep -iE 'certificate.*sha-?256.*digest|sha-?256.*certificate.*digest' | head -1 || true)
            if [ -z "$line" ]; then
              line=$(printf '%s\n' "$output" | grep -iE 'sha-?256.*digest' | head -1 || true)
            fi
            printf '%s\n' "$line" | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ':[:space:]\r' | tr 'A-F' 'a-f'
          }

          FINAL_CERT=$(extract_cert "$final_output")
          KEYSTORE_CERT=$(keytool -list -v -keystore "$KEYSTORE" -alias monitor-noticias -storepass "$ANDROID_SIGNING_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":","",$2); gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')

          echo "Release certificate:  $FINAL_CERT"
          echo "Keystore certificate: $KEYSTORE_CERT"
          test -n "$FINAL_CERT"
          test -n "$KEYSTORE_CERT"
          test "$KEYSTORE_CERT" = "$EXPECTED_CERT"
          test "$FINAL_CERT" = "$EXPECTED_CERT"
          echo "PERMANENT_SIGNING_OK=true"

      - name: Prepare v3.0.3 release asset
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk monitor-de-noticias-v3.0.3.apk

      - name: Point v3.0.3 tag to validated main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v3.0.3 "$GITHUB_SHA"
          git push --force origin refs/tags/v3.0.3

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.3
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v3.0.3
          body: |
            Monitor de Notícias Android v3.0.3 — Globoplay Trechos mais robusto e sincronização das notícias automáticas.

            Globoplay / telejornais:
            - mantém a aba Trechos (/cenas/) como fonte principal para telejornais nacionais e regionais;
            - passa a extrair links /v/<id> também quando os cards estão injetados em JSON/JavaScript e não existem como <a href> no HTML do Jsoup;
            - tenta aproveitar título e descrição próximos ao ID do vídeo dentro do JSON serializado;
            - candidatos que já casam pelo título/JSON continuam sendo priorizados;
            - uma quantidade pequena e limitada de candidatos sem match superficial também é aberta para consultar descrição, tags, keywords e metadados do /v/<id>;
            - essa leitura profunda é limitada por fonte para evitar voltar ao modelo fonte x termo e à explosão de consultas;
            - busca geral do Globoplay permanece como fallback quando a página do programa/Trechos não puder ser descoberta.

            Notícias automáticas:
            - quando o MonitorWorker conclui uma busca automática, Home e Histórico recarregam o mesmo banco usado pelo worker;
            - resultados notificados deixam de ficar apenas nos contadores das Configurações enquanto a interface permanece com estado antigo;
            - se o app estava fechado, a abertura continua carregando os registros persistidos normalmente.

            Monitor de Vídeos e agenda:
            - YouTube oficial permanece usando feed por canal e cruzamento local;
            - resultados progressivos, links diretos, deduplicação, cronômetro e barra de progresso são preservados;
            - horários automáticos de vídeos permanecem em aproximadamente 08h, 12h, 15h, 19h e 21h no horário local do aparelho;
            - busca manual permanece disponível e Android/Doze pode atrasar alguns minutos execuções em segundo plano.

            Atualização:
            - versionCode 303 / versionName 3.0.3;
            - mesmo applicationId e mesma assinatura permanente da linha v2.5+;
            - instalação direta sobre v3.0.2 preservando Termos, Demandas, histórico e configurações.
          files: monitor-de-noticias-v3.0.3.apk
          overwrite_files: true
          make_latest: true
