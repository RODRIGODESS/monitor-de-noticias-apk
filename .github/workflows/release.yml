name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Build installable APK
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk monitor-de-noticias-v2.4.0.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v2.4.0
          body: |
            Versão 2.4.0 do Monitor de Notícias Android.

            Correções principais:
            - filtro de fontes agora é estrito e descarta veículos não selecionados;
            - removida a correspondência genérica que fazia "Folha" aceitar Folha Vitória;
            - tela Notícias não mistura resultados atuais com notícias antigas do banco;
            - reabertura do app respeita o escopo de fontes selecionado;
            - mensagens de uma aba não permanecem indevidamente em outra.

            Interface:
            - nova Activity mobile-first para a v2.4;
            - cabeçalho respeita a barra de status do Android;
            - navegação superior mais baixa e compacta;
            - Fontes com cartões menores e mais veículos visíveis;
            - controles de seleção e filtros compactados;
            - Período com campos sem altura forçada, evitando corte de data/hora;
            - botão Pesquisar período sempre visível;
            - cards de notícias menores, com títulos limitados a duas linhas;
            - limpeza de entidades HTML como &nbsp; nos resumos.
          files: monitor-de-noticias-v2.4.0.apk
          make_latest: true
