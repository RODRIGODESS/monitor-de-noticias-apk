name: Temporary v3.0.8 history share patch

on:
  push:
    branches:
      - fix/v3.0.8-globoplay-metadata-whatsapp

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.8-globoplay-metadata-whatsapp
      - name: Apply guarded patch
        run: python3 tools/patch_v308_history_share.py
      - name: Verify
        run: |
          grep -q 'v28ShareWhatsApp' app/src/main/java/br/com/monitordenoticias/android/MainActivityV28.kt
          git diff --check
      - name: Commit application file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/br/com/monitordenoticias/android/MainActivityV28.kt
          git commit -m 'feat: share history news on WhatsApp'
          git push origin HEAD:fix/v3.0.8-globoplay-metadata-whatsapp
