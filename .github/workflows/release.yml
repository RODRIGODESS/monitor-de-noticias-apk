name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Build installable APK
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Print debug signing fingerprint
        run: |
          echo "SIGNING_FINGERPRINT_BEGIN"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:|SHA-256:"
          echo "SIGNING_FINGERPRINT_END"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk monitor-de-noticias-v2.5.0.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v2.5.0
          body: |
            Versão 2.5.0 do Monitor de Notícias Android.

            Demandas:
            - pesquisa independente de cada demanda;
            - monitoramento automático a cada 1 hora via WorkManager;
            - botão para pesquisar todas as demandas manualmente;
            - botão de pesquisa individual em cada demanda;
            - registro persistente da última execução, resultados, matérias novas e erros.

            Dados:
            - mesma identidade de pacote;
            - migração do banco sem apagar notícias, termos ou demandas existentes;
            - preferências de fontes, período e intervalo continuam preservadas.
          files: monitor-de-noticias-v2.5.0.apk
          make_latest: true
