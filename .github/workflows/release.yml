name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Validate code on pull request
        if: github.event_name == 'pull_request'
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: permanent Android signing secrets are missing."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/monitor-noticias-release.jks
          test -s signing/monitor-noticias-release.jks

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/signing/monitor-noticias-release.jks
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleRelease

      - name: Verify permanent signing certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          FINAL="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="signing/monitor-noticias-release.jks"
          EXPECTED_CERT="07164d3faf3ee09f241a547d403767c454b226faac26c4b058bc5011d773b1b0"

          "$APKSIGNER" verify --verbose "$FINAL"
          final_output=$("$APKSIGNER" verify --verbose --print-certs "$FINAL" 2>&1)
          printf '%s\n' "$final_output"

          extract_cert() {
            local output="$1"
            local line
            line=$(printf '%s\n' "$output" | grep -iE 'certificate.*sha-?256.*digest|sha-?256.*certificate.*digest' | head -1 || true)
            if [ -z "$line" ]; then
              line=$(printf '%s\n' "$output" | grep -iE 'sha-?256.*digest' | head -1 || true)
            fi
            printf '%s\n' "$line" | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ':[:space:]\r' | tr 'A-F' 'a-f'
          }

          FINAL_CERT=$(extract_cert "$final_output")
          KEYSTORE_CERT=$(keytool -list -v -keystore "$KEYSTORE" -alias monitor-noticias -storepass "$ANDROID_SIGNING_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":","",$2); gsub(/[[:space:]]/,"",$2); print tolower($2); exit}')

          echo "Release certificate:  $FINAL_CERT"
          echo "Keystore certificate: $KEYSTORE_CERT"
          test -n "$FINAL_CERT"
          test -n "$KEYSTORE_CERT"
          test "$KEYSTORE_CERT" = "$EXPECTED_CERT"
          test "$FINAL_CERT" = "$EXPECTED_CERT"
          echo "PERMANENT_SIGNING_OK=true"

      - name: Prepare v3.0.4 release asset
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk monitor-de-noticias-v3.0.4.apk

      - name: Point v3.0.4 tag to validated main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v3.0.4 "$GITHUB_SHA"
          git push --force origin refs/tags/v3.0.4

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.4
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v3.0.4
          body: |
            Monitor de Notícias Android v3.0.4 — Globoplay com rotas estáveis, flexões seguras e Limpar vídeos visível.

            Globoplay / telejornais:
            - rotas estáveis conhecidas de telejornais prioritários entram antes da busca dinâmica do Globoplay;
            - inclui Jornal Nacional, Jornal Hoje, Hora 1, Bom Dia Brasil, Jornal da Globo, RJ1/RJ2, SP1/SP2, Bom Dia ES e Jornal Tapajós entre as rotas estáveis iniciais;
            - landings históricas /v/<id> passam a servir como sementes para descobrir a página real /t/<token> do telejornal, sem transformar o vídeo antigo em resultado recorrente;
            - requisições usam perfil de navegador Android/Chrome e aceitam HTML ampliado para evitar truncar cards e JSON/JavaScript da aba Trechos;
            - os links /v/<id> continuam sendo extraídos do HTML e do JSON incorporado;
            - o cruzamento local aceita flexões nominais conservadoras como militar/militares, naval/navais e navio/navios;
            - tokens curtos continuam exatos, preservando a proteção contra falsos positivos como FAB/fábrica.

            Monitor de Vídeos:
            - botão Limpar vídeos fica sempre visível no card principal da aba Vídeos;
            - a limpeza exige confirmação e apaga somente o histórico de vídeos, mantendo Termos, Demandas, fontes e Notícias;
            - YouTube oficial continua usando feed por canal e cruzamento local;
            - resultados progressivos, links diretos, deduplicação, cronômetro e barra de progresso são preservados.

            Notícias automáticas:
            - permanece a sincronização da Home e do Histórico com o banco ao concluir os workers automáticos.

            Agenda:
            - horários automáticos de vídeos permanecem aproximadamente em 08h, 12h, 15h, 19h e 21h no horário local do aparelho;
            - busca manual permanece disponível;
            - Android/Doze pode atrasar alguns minutos execuções em segundo plano.

            Atualização:
            - versionCode 304 / versionName 3.0.4;
            - mesmo applicationId e mesma assinatura permanente da linha v2.5+;
            - instalação direta sobre v3.0.3 preservando Termos, Demandas, histórico de notícias e configurações.
          files: monitor-de-noticias-v3.0.4.apk
          overwrite_files: true
          make_latest: true
