name: Apply v3.0.7 discovery aliases

on:
  push:
    branches: ["fix/v3.0.7-globoplay-editions-errors"]
    paths: [".github/workflows/apply-v307-discovery-aliases.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.7-globoplay-editions-errors
          fetch-depth: 0
      - name: Apply discovery aliases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/br/com/monitordenoticias/android/GloboplayEditionCollector.kt")
          text = p.read_text()

          old = '''        if (programPages.isEmpty()) {\n            val discoveryUrl = buildDiscoveryUrl(source)\n            val discoveryDoc = fetchDocumentOrNull(discoveryUrl, onError)\n            if (discoveryDoc != null) {\n                extractProgramPages(source, discoveryDoc, discoveryUrl).forEach(programPages::add)\n\n                if (programPages.isEmpty()) {\n                    extractDirectVideoLinks(discoveryDoc, discoveryUrl)\n                        .take(seedLimitFor(source))\n                        .forEach { direct ->\n                            val doc = fetchDocumentOrNull(direct, onError) ?: return@forEach\n                            seedDocs += doc to direct\n                            extractProgramPages(source, doc, direct).forEach(programPages::add)\n                        }\n                }\n            }\n        }'''
          new = '''        if (programPages.isEmpty()) {\n            buildDiscoveryUrls(source).forEach { discoveryUrl ->\n                if (programPages.isNotEmpty()) return@forEach\n                val discoveryDoc = fetchDocumentOrNull(discoveryUrl, onError) ?: return@forEach\n                extractProgramPages(source, discoveryDoc, discoveryUrl).forEach(programPages::add)\n\n                if (programPages.isEmpty()) {\n                    extractDirectVideoLinks(discoveryDoc, discoveryUrl)\n                        .take(seedLimitFor(source))\n                        .forEach { direct ->\n                            val doc = fetchDocumentOrNull(direct, onError) ?: return@forEach\n                            seedDocs += doc to direct\n                            extractProgramPages(source, doc, direct).forEach(programPages::add)\n                        }\n                }\n            }\n        }'''
          if text.count(old) != 1:
              raise SystemExit("discovery block not found exactly once")
          text = text.replace(old, new, 1)

          old = '''    private fun buildDiscoveryUrl(source: VideoSource): String {\n        if (source.searchUrlTemplate.isBlank()) return source.landingUrl\n        val state = source.state.trim().takeIf { it.length == 2 && !it.equals("BR", true) }.orEmpty()\n        val query = listOf(source.searchPrefix.trim(), state)\n            .filter { it.isNotBlank() }\n            .joinToString(" ")\n        return source.searchUrlTemplate.replace("{query}", URLEncoder.encode(query, "UTF-8"))\n    }'''
          new = '''    private fun buildDiscoveryUrls(source: VideoSource): List<String> {\n        if (source.searchUrlTemplate.isBlank()) return listOf(source.landingUrl)\n        val state = source.state.trim().takeIf { it.length == 2 && !it.equals("BR", true) }.orEmpty()\n        val primary = normalize(source.searchPrefix)\n        val queries = buildList {\n            if (source.searchPrefix.isNotBlank()) add(source.searchPrefix.trim())\n            source.aliases\n                .filter { alias ->\n                    val normalized = normalize(alias)\n                    normalized.isNotBlank() &&\n                        normalized != primary &&\n                        normalized !in DISCOVERY_GENERIC_ALIASES\n                }\n                .take(MAX_DISCOVERY_ALIASES)\n                .forEach(::add)\n        }.distinctBy(::normalize)\n\n        return queries.map { program ->\n            val query = listOf(program, state).filter { it.isNotBlank() }.joinToString(" ")\n            source.searchUrlTemplate.replace("{query}", URLEncoder.encode(query, "UTF-8"))\n        }.distinct()\n    }'''
          if text.count(old) != 1:
              raise SystemExit("buildDiscoveryUrl not found exactly once")
          text = text.replace(old, new, 1)

          old = '''            "globoplay-tj1-tapajos" to "https://globoplay.globo.com/jornal-tapajos-1a-edicao/t/hTwfdtmDCQ",\n            "globoplay-mg1" to "https://globoplay.globo.com/mg1/t/W7MJbpNcVy",\n            "globoplay-bom-dia-minas" to "https://globoplay.globo.com/bom-dia-minas/t/N22TfC8fcB"'''
          new = '''            "globoplay-tj1-tapajos" to "https://globoplay.globo.com/jornal-tapajos-1a-edicao/t/hTwfdtmDCQ",\n            "globoplay-mg1" to "https://globoplay.globo.com/mg1/t/W7MJbpNcVy",\n            "globoplay-mg2" to "https://globoplay.globo.com/mg2/t/5PvVyhyLW1",\n            "globoplay-bom-dia-minas" to "https://globoplay.globo.com/bom-dia-minas/t/N22TfC8fcB",\n            "globoplay-pi1" to "https://globoplay.globo.com/pitv-1a-edicao/t/M5f6Kxnmxd",\n            "globoplay-pi2" to "https://globoplay.globo.com/pitv-2a-edicao/t/LgVGXnBRsd",\n            "globoplay-bom-dia-piaui" to "https://globoplay.globo.com/bom-dia-piaui/t/pPhwC5YTNK",\n            "globoplay-df1" to "https://globoplay.globo.com/df1/t/jcbtdbRMHz",\n            "globoplay-df2" to "https://globoplay.globo.com/df2/t/qP1JkMxfCw",\n            "globoplay-ne1" to "https://globoplay.globo.com/ne1/t/MHH2V957Mn"'''
          if text.count(old) != 1:
              raise SystemExit("known program map tail not found exactly once")
          text = text.replace(old, new, 1)

          old = '''        private const val MAX_TRECHOS_PER_SOURCE = 96\n        private const val EMBEDDED_CONTEXT_WINDOW = 1800'''
          new = '''        private const val MAX_TRECHOS_PER_SOURCE = 96\n        private const val MAX_DISCOVERY_ALIASES = 2\n        private const val EMBEDDED_CONTEXT_WINDOW = 1800'''
          if text.count(old) != 1:
              raise SystemExit("constants block not found exactly once")
          text = text.replace(old, new, 1)

          old = '''        private val GENERIC_ALIAS_TOKENS = setOf("globo", "globoplay", "telejornal", "regional", "jornalismo")\n        private val GENERIC_TITLES'''
          new = '''        private val GENERIC_ALIAS_TOKENS = setOf("globo", "globoplay", "telejornal", "regional", "jornalismo")\n        private val DISCOVERY_GENERIC_ALIASES = setOf("globo", "globoplay", "tv globo")\n        private val GENERIC_TITLES'''
          if text.count(old) != 1:
              raise SystemExit("generic alias block not found exactly once")
          text = text.replace(old, new, 1)

          p.write_text(text)
          checks = [
              'buildDiscoveryUrls(source).forEach' in text,
              'globoplay-pi1' in text and 'M5f6Kxnmxd' in text,
              'globoplay-pi2' in text and 'LgVGXnBRsd' in text,
              'globoplay-df1' in text and 'jcbtdbRMHz' in text,
              'globoplay-df2' in text and 'qP1JkMxfCw' in text,
              'globoplay-ne1' in text and 'MHH2V957Mn' in text,
              'globoplay-mg2' in text and '5PvVyhyLW1' in text,
              'MAX_DISCOVERY_ALIASES = 2' in text,
          ]
          if not all(checks):
              raise SystemExit("discovery alias guards failed")
          print('V307_DISCOVERY_ALIASES_OK=true')
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/GloboplayEditionCollector.kt
          git diff --cached --check
          git commit -m "feat: ampliar descoberta por aliases do Globoplay"
          git push origin HEAD:fix/v3.0.7-globoplay-editions-errors
