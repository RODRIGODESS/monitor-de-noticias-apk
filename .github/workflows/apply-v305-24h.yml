name: Apply v3.0.5 24h window

on:
  push:
    branches: ["fix/v3.0.5-video-24h"]
    paths: [".github/workflows/apply-v305-24h.yml"]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.0.5-video-24h
          fetch-depth: 0

      - name: Apply guarded Kotlin changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 occurrence, found {count}\n---needle---\n{old}")
              p.write_text(text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old}")
              p.write_text(text.replace(old, new))

          repo = "app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt"
          replace_once(
              repo,
              '''            val capturedAt = System.currentTimeMillis()\n            val startedAt = capturedAt\n            val collected = linkedMapOf<String, VideoItem>()''',
              '''            val capturedAt = System.currentTimeMillis()\n            val startedAt = capturedAt\n            // A busca normal e a automática trabalham sempre com uma janela móvel de 24h.\n            // Pesquisas de período continuam usando from/to explícitos.\n            val effectiveTo = to ?: capturedAt\n            val effectiveFrom = from ?: (effectiveTo - DEFAULT_VIDEO_WINDOW_MS)\n            val collected = linkedMapOf<String, VideoItem>()'''
          )
          replace_count(repo, 'inPeriod(item, from, to)', 'inPeriod(item, effectiveFrom, effectiveTo)', 2)
          replace_once(
              repo,
              '''    companion object {\n        private const val BROWSER_USER_AGENT''',
              '''    companion object {\n        private const val DEFAULT_VIDEO_WINDOW_MS = 24L * 60L * 60L * 1000L\n        private const val BROWSER_USER_AGENT'''
          )
          replace_count(repo, 'MonitorNoticias/3.0.3', 'MonitorNoticias/3.0.5', 2)

          vm = "app/src/main/java/br/com/monitordenoticias/android/VideoViewModel.kt"
          replace_once(vm, 'status = "Buscando vídeos em tempo real..."', 'status = "Buscando vídeos das últimas 24h..."')

          collector = "app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt"
          replace_once(
              collector,
              '''import java.net.URLEncoder\nimport java.text.Normalizer\nimport kotlin.math.abs''',
              '''import java.net.URLEncoder\nimport java.text.Normalizer\nimport java.text.SimpleDateFormat\nimport java.util.Calendar\nimport java.util.Locale\nimport kotlin.math.abs'''
          )
          replace_once(
              collector,
              '''        fun addCandidate(direct: String, rawTitle: String, rawSummary: String) {\n            val cleanedTitle = cleanTrechoTitle(rawTitle, source.searchPrefix)\n            val title = cleanedTitle.takeIf(::usefulTitle)\n                ?: "Trecho recente • ${source.searchPrefix.ifBlank { source.name }}"\n            val contextual = cleanText(rawSummary)\n            val summary = listOf(source.searchPrefix, contextual)\n                .filter { it.isNotBlank() && normalize(it) != normalize(title) }\n                .distinctBy(::normalize)\n                .joinToString(" • ")\n                .take(900)\n\n            val candidate = VideoItem(\n                title = title.take(220),\n                sourceId = source.id,\n                sourceName = source.name,\n                publishedAt = capturedAt,\n                link = direct,\n                summary = summary,\n                capturedAt = capturedAt\n            )''',
              '''        fun addCandidate(\n            direct: String,\n            rawTitle: String,\n            rawSummary: String,\n            publishedAt: Long = capturedAt\n        ) {\n            val cleanedTitle = cleanTrechoTitle(rawTitle, source.searchPrefix)\n            val title = cleanedTitle.takeIf(::usefulTitle)\n                ?: "Trecho recente • ${source.searchPrefix.ifBlank { source.name }}"\n            val contextual = cleanText(rawSummary)\n            val summary = listOf(source.searchPrefix, contextual)\n                .filter { it.isNotBlank() && normalize(it) != normalize(title) }\n                .distinctBy(::normalize)\n                .joinToString(" • ")\n                .take(900)\n\n            val candidate = VideoItem(\n                title = title.take(220),\n                sourceId = source.id,\n                sourceName = source.name,\n                publishedAt = publishedAt,\n                link = direct,\n                summary = summary,\n                capturedAt = capturedAt\n            )'''
          )
          replace_once(
              collector,
              '''        // Caminho 1: cards presentes diretamente no HTML.\n        doc.select("a[href]").forEach { anchor ->\n            val absolute = anchor.absUrl("href").ifBlank { resolveUrl(pageUrl, anchor.attr("href")) }\n            val direct = normalizeDirectVideoUrl(absolute) ?: return@forEach\n\n            val rawTitle = sequenceOf(\n                anchor.attr("aria-label"),\n                anchor.attr("title"),\n                anchor.selectFirst("img[alt]")?.attr("alt").orEmpty(),\n                anchor.text()\n            ).map(::cleanText).firstOrNull { it.isNotBlank() }.orEmpty()\n\n            val parentText = cleanText(anchor.parent()?.text().orEmpty())\n            addCandidate(direct, rawTitle, parentText)\n        }''',
              '''        // Caminho 1: cards presentes diretamente no HTML. Os cabeçalhos da\n        // aba Trechos (ex.: "Hoje, 07/09/2026") delimitam a data dos links abaixo.\n        // Se só houver a data, usamos o fim daquele dia para evitar falso negativo\n        // na janela móvel de 24h; a página /v/<id> ainda pode substituir por horário exato.\n        var sectionPublishedAt: Long? = null\n        doc.select("h1,h2,h3,h4,a[href]").forEach { element ->\n            if (element.tagName().startsWith("h", ignoreCase = true)) {\n                sectionPublishedAt = parseSectionDateEnd(element.text())\n                return@forEach\n            }\n\n            val anchor = element\n            val absolute = anchor.absUrl("href").ifBlank { resolveUrl(pageUrl, anchor.attr("href")) }\n            val direct = normalizeDirectVideoUrl(absolute) ?: return@forEach\n\n            val rawTitle = sequenceOf(\n                anchor.attr("aria-label"),\n                anchor.attr("title"),\n                anchor.selectFirst("img[alt]")?.attr("alt").orEmpty(),\n                anchor.text()\n            ).map(::cleanText).firstOrNull { it.isNotBlank() }.orEmpty()\n\n            val parentText = cleanText(anchor.parent()?.text().orEmpty())\n            addCandidate(direct, rawTitle, parentText, sectionPublishedAt ?: capturedAt)\n        }'''
          )
          replace_once(
              collector,
              '''            val embeddedSummary = nearestJsonValue(context, center, EMBEDDED_SUMMARY_REGEX, 8, 900)\n            addCandidate(direct, embeddedTitle, embeddedSummary)''',
              '''            val embeddedSummary = nearestJsonValue(context, center, EMBEDDED_SUMMARY_REGEX, 8, 900)\n            val embeddedPublishedAt = nearestSectionDateEnd(context, center) ?: capturedAt\n            addCandidate(direct, embeddedTitle, embeddedSummary, embeddedPublishedAt)'''
          )
          replace_once(
              collector,
              '''    private fun candidateQuality(item: VideoItem): Int {\n        var score = 0\n        if (!item.title.startsWith("Trecho recente •", ignoreCase = true)) score += 30\n        if (item.summary.isNotBlank()) score += minOf(item.summary.length / 30, 20)\n        return score\n    }''',
              '''    private fun candidateQuality(item: VideoItem): Int {\n        var score = 0\n        if (!item.title.startsWith("Trecho recente •", ignoreCase = true)) score += 30\n        if (item.summary.isNotBlank()) score += minOf(item.summary.length / 30, 20)\n        if (item.publishedAt != item.capturedAt) score += 8\n        return score\n    }'''
          )
          replace_once(
              collector,
              '''    private fun cleanJsonText(value: String): String {''',
              '''    private fun nearestSectionDateEnd(context: String, center: Int): Long? =\n        SECTION_DATE_REGEX.findAll(context)\n            .mapNotNull { match ->\n                parseSectionDateEnd(match.value)?.let { publishedAt ->\n                    publishedAt to abs(match.range.first - center)\n                }\n            }\n            .minByOrNull { it.second }\n            ?.first\n\n    private fun parseSectionDateEnd(value: String): Long? {\n        val rawDate = SECTION_DATE_REGEX.find(value)?.groupValues?.getOrNull(1).orEmpty()\n        if (rawDate.isBlank()) return null\n        val parsed = runCatching {\n            SimpleDateFormat("dd/MM/yyyy", Locale("pt", "BR")).apply { isLenient = false }.parse(rawDate)\n        }.getOrNull() ?: return null\n\n        return Calendar.getInstance().apply {\n            time = parsed\n            set(Calendar.HOUR_OF_DAY, 23)\n            set(Calendar.MINUTE, 59)\n            set(Calendar.SECOND, 59)\n            set(Calendar.MILLISECOND, 999)\n        }.timeInMillis\n    }\n\n    private fun cleanJsonText(value: String): String {'''
          )
          replace_once(
              collector,
              '''        private val DURATION_PREFIX_REGEX = Regex(\n            "^(?:\\\\d+\\\\s*(?:h|min|seg|s)\\\\s*)+",\n            RegexOption.IGNORE_CASE\n        )''',
              '''        private val DURATION_PREFIX_REGEX = Regex(\n            "^(?:\\\\d+\\\\s*(?:h|min|seg|s)\\\\s*)+",\n            RegexOption.IGNORE_CASE\n        )\n        private val SECTION_DATE_REGEX = Regex("\\\\b(\\\\d{2}/\\\\d{2}/\\\\d{4})\\\\b")'''
          )

          gradle = "app/build.gradle.kts"
          replace_once(gradle, 'versionCode = 304', 'versionCode = 305')
          replace_once(gradle, 'versionName = "3.0.4"', 'versionName = "3.0.5"')

          # Guardas finais: nenhuma janela antiga sem recorte e versão consistente.
          repo_text = Path(repo).read_text()
          collector_text = Path(collector).read_text()
          gradle_text = Path(gradle).read_text()
          assert 'effectiveFrom = from ?: (effectiveTo - DEFAULT_VIDEO_WINDOW_MS)' in repo_text
          assert repo_text.count('inPeriod(item, effectiveFrom, effectiveTo)') == 2
          assert 'SECTION_DATE_REGEX' in collector_text
          assert 'sectionPublishedAt' in collector_text
          assert 'versionCode = 305' in gradle_text and 'versionName = "3.0.5"' in gradle_text
          print('PATCH_V305_OK=true')
          PY

      - name: Commit application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt \
                  app/src/main/java/br/com/monitordenoticias/android/VideoViewModel.kt \
                  app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt \
                  app/build.gradle.kts
          git diff --cached --check
          git commit -m "fix: usar últimas 24h e preservar data dos Trechos"
          git push origin HEAD:fix/v3.0.5-video-24h
