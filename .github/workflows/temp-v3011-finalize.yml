name: Temporary v3.0.11 finalizer

on:
  push:
    branches:
      - codex/v3.0.11-source-expansion

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3.0.11-source-expansion
      - name: Apply guarded final patch
        run: python3 tools/patch_v3011_release.py
      - name: Verify final release patch
        run: |
          grep -q 'versionCode = 311' app/build.gradle.kts
          grep -q 'versionName = "3.0.11"' app/build.gradle.kts
          grep -q 'globoplay-fantastico' app/src/main/java/br/com/monitordenoticias/android/VideoSourceCatalog.kt
          grep -q '/jr-na-tv/integras/video/' app/src/main/java/br/com/monitordenoticias/android/VideoSourceCatalog.kt
          grep -q 'searchUrlTemplate.isNotBlank() && source.searchPrefix.isNotBlank()' app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          grep -q 'tag_name: v3.0.11' .github/workflows/release.yml
          grep -q 'monitor-de-noticias-v3.0.11.apk' .github/workflows/release.yml
          git diff --check
      - name: Commit final v3.0.11 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
                  .github/workflows/release.yml \
                  app/src/main/java/br/com/monitordenoticias/android/VideoSourceCatalog.kt \
                  app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          git commit -m 'release: prepare v3.0.11'
          git push origin HEAD:codex/v3.0.11-source-expansion
