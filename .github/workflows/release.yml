name: Build and Release Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip

      - name: Build installable APK
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk monitor-de-noticias-v2.3.0.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          target_commitish: ${{ github.sha }}
          name: Monitor de Notícias Android v2.3.0
          body: |
            Versão 2.3.0 do Monitor de Notícias Android.

            Foco desta versão: experiência móvel e densidade de informação.

            Destaques:
            - cabeçalho superior muito mais compacto;
            - navegação horizontal reduzida e mais eficiente;
            - tipografia e espaçamentos recalibrados para celular;
            - Fontes reformulada com lista compacta e vários veículos visíveis por tela;
            - cartões de fonte menores, mantendo destaque claro das selecionadas;
            - busca, filtros por região/estado e seleção em massa preservados;
            - barra inferior fixa em Fontes com resumo e botão Buscar agora;
            - Período reformulado com campos compactos de data/hora;
            - botão Pesquisar período sempre visível na parte inferior;
            - atalhos Hoje, 24 horas, 7 dias e 30 dias compactados;
            - resultados do período exibidos abaixo do formulário sem esconder a ação principal;
            - Notícias, Demandas, Histórico, Termos e Configurações também receberam layout mais denso;
            - cards, badges e estados vazios redesenhados para consistência visual.
          files: monitor-de-noticias-v2.3.0.apk
          make_latest: true
