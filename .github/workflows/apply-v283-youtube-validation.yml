name: Apply v2.8.3 YouTube validation

on:
  push:
    branches: ["feature/v2.8.3-youtube-official-channels"]
    paths:
      - "scripts/apply_v283_youtube_validation.py"
      - ".github/workflows/apply-v283-youtube-validation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.8.3-youtube-official-channels
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_v283_youtube_validation.py

      - name: Commit patched repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          if git diff --cached --quiet; then
            echo "Repository already patched"
            exit 0
          fi
          git commit -m "fix: accept only direct YouTube video URLs"
          git push origin HEAD:feature/v2.8.3-youtube-official-channels
