name: Diagnose Globoplay v3.0.1

on:
  push:
    branches: ["fix/v3.0.1-video-scan-and-demand-alerts"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test G1 feed pages
        run: |
          set -u
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'
          base='https://g1.globo.com/ma/maranhao/videos-bom-dia-mirante/index/feed/'
          for n in 1 2 3 4 5; do
            url="${base}pagina-${n}.ghtml"
            echo "=== $url ==="
            code=$(curl -L --max-time 20 -A "$UA" -o /tmp/feed.html -sS -w '%{http_code}' "$url" || true)
            echo "HTTP=$code bytes=$(wc -c < /tmp/feed.html 2>/dev/null || echo 0)"
            if grep -q '14937180' /tmp/feed.html; then echo 'TARGET=yes'; else echo 'TARGET=no'; fi
            grep -Eio 'https?[^" ]+/video/[^" ]+[0-9]{7,9}\.ghtml' /tmp/feed.html | head -8 || true
          done
