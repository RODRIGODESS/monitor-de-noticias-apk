name: Apply v3.0.3 guarded patch

on:
  push:
    branches:
      - fix/v3.0.3-globoplay-news-sync
    paths:
      - tools/patch_v303.py
      - .github/workflows/temp-v303-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v3.0.3-globoplay-news-sync
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 tools/patch_v303.py

      - name: Validate patch shape
        run: |
          set -euo pipefail
          git diff --check
          git diff -- app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt \
            app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt \
            app/src/main/java/br/com/monitordenoticias/android/MonitorViewModel.kt \
            app/build.gradle.kts
          grep -q 'versionCode = 303' app/build.gradle.kts
          grep -q 'versionName = "3.0.3"' app/build.gradle.kts
          grep -q 'MAX_GLOBOPLAY_DEEP_FALLBACK_PER_SOURCE = 6' app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          grep -q 'registerOnSharedPreferenceChangeListener(autoRunListener)' app/src/main/java/br/com/monitordenoticias/android/MonitorViewModel.kt

      - name: Commit app changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/br/com/monitordenoticias/android/GloboplayTrechosCollector.kt \
            app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt \
            app/src/main/java/br/com/monitordenoticias/android/MonitorViewModel.kt \
            app/build.gradle.kts
          git diff --cached --quiet && { echo 'No app changes to commit'; exit 0; }
          git commit -m "fix: Globoplay metadata fallback and automatic news sync"
          git push origin HEAD:fix/v3.0.3-globoplay-news-sync
