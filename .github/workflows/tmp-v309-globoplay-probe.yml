name: TEMP Probe JH JN raw HTML

on:
  push:
    branches:
      - fix/v3.0.9-national-globoplay-diagnostics-layout

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Jarvis GraphQL root fields
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://cloud-jarvis.globo.com/graphql'
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          endpoint='https://cloud-jarvis.globo.com/graphql'
          headers={
            'content-type':'application/json',
            'x-platform-id':'web',
            'x-device-id':'desktop',
            'x-client-version':'2024.12-5',
            'user-agent':'Mozilla/5.0'
          }
          fields=[
            'title','titles','program','programs','video','videos','episode','episodes',
            'clips','scenes','trechos','highlights','rail','rails','collection','collections',
            'playlist','playlists','search','searchV2','content','contents','catalog','category',
            'categories','recommendations','titleVideos','programVideos','titleEpisodes'
          ]
          for f in fields:
            payload=json.dumps({'query':f'query Probe {{ {f} {{ __typename }} }}'}).encode()
            req=urllib.request.Request(endpoint,data=payload,headers=headers,method='POST')
            try:
              with urllib.request.urlopen(req,timeout=20) as r: body=r.read().decode()
            except urllib.error.HTTPError as e:
              body=e.read().decode()
            try: d=json.loads(body)
            except Exception: d={'raw':body[:500]}
            errs=d.get('errors') or []
            msgs=' | '.join(x.get('message','') for x in errs)
            data=d.get('data')
            print(f'FIELD={f} DATA={data} ERR={msgs[:1200]}')
          PY
