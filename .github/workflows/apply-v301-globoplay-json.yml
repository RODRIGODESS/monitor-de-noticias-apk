name: Apply v3.0.1 Globoplay JSON fix

on:
  push:
    branches:
      - fix/v3.0.1-globoplay-embedded-json

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/v3.0.1-globoplay-embedded-json
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply_v301_globoplay_json_fix.py

      - name: Validate patch
        run: |
          git diff --check
          grep -F 'normalizeEmbeddedScriptText(doc.html(), decodeQuotes = false)' app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          grep -F 'categor(?:y|ies)' app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt
          grep -F 'publishedAt|publicationDate|publishedDate' app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt

      - name: Commit fix and remove temporary files
        run: |
          rm .github/workflows/apply-v301-globoplay-json.yml
          rm scripts/apply_v301_globoplay_json_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: parse escaped Globoplay embedded metadata'
          git push origin HEAD:fix/v3.0.1-globoplay-embedded-json
